<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI军团 · 管理后台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
  /* Login */
  .login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
  .login-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(79,195,247,.15);border-radius:20px;padding:48px 40px;width:400px;max-width:90vw}
  .login-card h1{text-align:center;font-size:28px;color:#4fc3f7;margin-bottom:32px}
  .login-card input{width:100%;height:48px;background:rgba(15,15,35,.8);border:1px solid rgba(79,195,247,.2);border-radius:12px;padding:0 20px;color:#e0e0e0;font-size:16px;outline:none;margin-bottom:20px}
  .login-card input:focus{border-color:#4fc3f7}
  .login-card button{width:100%;height:48px;background:linear-gradient(135deg,#7b1fa2,#4fc3f7);border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .login-card button:hover{opacity:.9}
  .login-card .hint{text-align:center;font-size:13px;color:#6a6a7a;margin-top:16px}
  .login-card .error{color:#ff5252;font-size:14px;text-align:center;margin-bottom:16px;display:none}
  /* Main */
  .hidden{display:none!important}
  .app{display:flex;min-height:100vh}
  .sidebar{width:240px;background:#12122a;border-right:1px solid rgba(79,195,247,.1);padding:24px 0;flex-shrink:0}
  .sidebar .logo{padding:0 24px 24px;border-bottom:1px solid rgba(79,195,247,.1);margin-bottom:16px}
  .sidebar .logo h2{font-size:20px;color:#4fc3f7}
  .sidebar .logo span{font-size:12px;color:#6a6a7a;display:block}
  .sidebar nav a{display:block;padding:14px 24px;color:#b0b0c0;text-decoration:none;font-size:15px;border-left:3px solid transparent;transition:.2s}
  .sidebar nav a:hover,.sidebar nav a.active{color:#4fc3f7;background:rgba(79,195,247,.05);border-left-color:#4fc3f7}
  .main{flex:1;padding:32px;overflow-y:auto;max-height:100vh}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
  .header h1{font-size:26px;color:#e0e0e0}
  .header button{background:rgba(255,82,82,.1);color:#ff5252;border:1px solid rgba(255,82,82,.2);border-radius:10px;padding:10px 24px;font-size:14px;cursor:pointer}
  /* Cards */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:32px}
  .stat-card{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(79,195,247,.1);border-radius:16px;padding:24px}
  .stat-card .label{font-size:13px;color:#6a6a7a;display:block;margin-bottom:8px;text-transform:uppercase}
  .stat-card .value{font-size:36px;font-weight:700;background:linear-gradient(90deg,#4fc3f7,#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  /* Table */
  .section{background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(79,195,247,.1);border-radius:16px;padding:24px;margin-bottom:24px}
  .section h3{font-size:18px;color:#e0e0e0;margin-bottom:20px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:12px 16px;font-size:13px;color:#6a6a7a;text-transform:uppercase;border-bottom:1px solid rgba(79,195,247,.1)}
  td{padding:14px 16px;font-size:14px;border-bottom:1px solid rgba(79,195,247,.05)}
  tr:hover td{background:rgba(79,195,247,.03)}
  .badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500}
  .badge.blue{background:rgba(79,195,247,.15);color:#4fc3f7}
  .badge.green{background:rgba(0,230,118,.15);color:#00e676}
  .badge.amber{background:rgba(255,171,0,.15);color:#ffab00}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tag{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(79,195,247,.1);color:#4fc3f7}
  /* Detail Panel */
  .back-btn{background:rgba(79,195,247,.1);color:#4fc3f7;border:1px solid rgba(79,195,247,.2);border-radius:10px;padding:8px 20px;cursor:pointer;margin-bottom:24px;font-size:14px}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
  .kpi-box{background:rgba(15,15,35,.6);border-radius:10px;padding:16px}
  .kpi-box .kpi-name{font-size:12px;color:#6a6a7a;display:block}
  .kpi-box .kpi-val{font-size:20px;font-weight:600;color:#4fc3f7;margin-top:4px}
  /* Toast */
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#ff5252;color:#fff;padding:12px 32px;border-radius:25px;font-size:14px;z-index:1000;display:none}
  .toast.show{display:block}
  /* Loading */
  .loading{text-align:center;padding:40px;color:#6a6a7a}
  /* 聊天指挥台 */
  .chat-panel{margin-top:24px;background:linear-gradient(135deg,#1a1a2e,#16213e);border:1px solid rgba(79,195,247,.15);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .chat-panel-header{padding:14px 18px;border-bottom:1px solid rgba(79,195,247,.1);color:#4fc3f7;font-size:14px;font-weight:600}
  .chat-box{flex:1;overflow-y:auto;padding:16px;min-height:240px;max-height:400px;display:flex;flex-direction:column;gap:12px}
  .chat-msg{display:flex;gap:10px;align-items:flex-start}
  .chat-msg.user{flex-direction:row-reverse}
  .chat-mini-avatar{width:28px;height:28px;border-radius:8px;background:rgba(79,195,247,.15);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .chat-msg.user .chat-mini-avatar{background:rgba(0,230,118,.15)}
  .chat-bubble{max-width:82%;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);color:#d8d8e8;font-size:13px;line-height:1.65;word-break:break-word}
  .chat-msg.user .chat-bubble{background:rgba(79,195,247,.15)}
  .chat-bubble pre{background:rgba(0,0,0,.35);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:12px}
  .chat-bubble table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
  .chat-bubble th,.chat-bubble td{border:1px solid rgba(255,255,255,.1);padding:4px 8px;text-align:left}
  .chat-bubble a{color:#4fc3f7}
  .chat-bubble p{margin:4px 0}
  .chat-quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
  .chat-chip{padding:6px 14px;border-radius:20px;border:1px solid rgba(79,195,247,.3);background:rgba(79,195,247,.08);color:#9ad6f5;font-size:12px;cursor:pointer;transition:.2s;user-select:none}
  .chat-chip:hover{background:rgba(79,195,247,.18)}
  .chat-chip.hot{background:rgba(79,195,247,.18);border-color:#4fc3f7;color:#e3f4fd}
  .chat-input-row{display:flex;gap:10px;padding:12px 16px;border-top:1px solid rgba(79,195,247,.1)}
  .chat-input{flex:1;padding:10px 14px;border-radius:10px;border:1px solid rgba(79,195,247,.2);background:rgba(15,15,35,.6);color:#e0e0e0;font-size:13px;outline:none}
  .chat-input:focus{border-color:#4fc3f7}
  .chat-typing{display:inline-flex;gap:4px;padding:4px 0}
  .chat-typing i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);animation:chatBlink 1s infinite}
  .chat-typing i:nth-child(2){animation-delay:.2s}
  .chat-typing i:nth-child(3){animation-delay:.4s}
  @keyframes chatBlink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .chat-act{display:inline-block;margin-top:6px;padding:6px 14px;border-radius:8px;border:1px solid rgba(79,195,247,.4);background:rgba(79,195,247,.12);color:#9ad6f5;font-size:12px;cursor:pointer;transition:.2s}
  .chat-act:hover{background:rgba(79,195,247,.25)}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <h1>AI军团 · 管理后台</h1>
    <div id="loginError" class="error"></div>
    <input type="password" id="adminKey" placeholder="请输入 Admin Key（启动时终端显示）" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">🔑 登录管理后台</button>
    <div class="hint">Admin Key 在启动后端时终端显示，也可在 data/.admin_key 文件中查看</div>
  </div>
</div>

<!-- Main App -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="logo">
      <h2>🎖️ AI军团</h2>
      <span>管理后台 v4.0</span>
    </div>
    <nav>
      <a href="#" data-page="overview" class="active" onclick="showPage('overview')">📊 系统概览</a>
      <a href="#" data-page="users" onclick="showPage('users')">👥 商家管理</a>
    </nav>
  </aside>
  <main class="main">
    <header class="header">
      <h1 id="pageTitle">系统概览</h1>
      <button onclick="logout()">退出登录</button>
    </header>
    <div id="pageContent"></div>
    <div class="chat-panel" id="chat-panel-admin">
      <div class="chat-panel-header">💬 AI 指挥台</div>
      <div class="chat-box" id="chat-box-admin"></div>
      <div class="chat-quick" id="chat-quick-admin"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input-admin" placeholder="对 AI 指挥台说点什么...（回车发送）" onkeydown="if(event.key==='Enter')chatSend('admin')">
        <button style="background:linear-gradient(135deg,#7b1fa2,#4fc3f7);border:none;border-radius:10px;color:#fff;padding:10px 22px;font-size:13px;cursor:pointer" onclick="chatSend('admin')">发送</button>
      </div>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>

<script>
const API = '';
let adminToken = localStorage.getItem('admin_token') || '';

function $(id){return document.getElementById(id)}

async function api(url){
  const headers={'Authorization':'Bearer '+adminToken,'Content-Type':'application/json'};
  const r = await fetch(API+url,{headers});
  if(r.status===401){logout(true);throw new Error('未授权');}
  return r.json();
}

function toast(msg,ms=3000){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

async function login(){
  const key=$('adminKey').value.trim();
  if(!key)return;
  try{
    const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const d=await r.json();
    if(d.status==='success'){
      adminToken=d.token;
      localStorage.setItem('admin_token',adminToken);
      $('loginScreen').classList.add('hidden');
      $('app').classList.remove('hidden');
      initChatAdmin();
      showPage('overview');
    }else{
      $('loginError').style.display='block';
      $('loginError').textContent=d.message||'密钥错误';
    }
  }catch(e){toast('连接失败，请确认后端已启动');}
}

function logout(silent){
  localStorage.removeItem('admin_token');
  adminToken='';
  $('loginScreen').classList.remove('hidden');
  $('app').classList.add('hidden');
  if(!silent)toast('已退出');
}

function showPage(page){
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('active'));
  document.querySelector('[data-page="'+page+'"]').classList.add('active');
  _adminPage = page;
  chatContext();
  if(page==='overview')loadOverview();
  else if(page==='users')loadUsers();
}

const TYPE_LABELS={restaurant:'餐饮',retail:'零售百货',hotel:'酒店民宿',service:'生活服务',fitness:'健身运动',education:'教育培训',entertainment:'文化娱乐',florist:'花店',auto:'汽车服务',custom:'通用/其他'};

async function loadOverview(){
  $('pageTitle').textContent='📊 系统概览';
  try{
    const stats=await api('/api/admin/stats');
    const users=await api('/api/admin/users');
    const u=users.users||[];

    const active=u.filter(x=>x.last_login).length;
    const todayUsers=u.filter(x=>{
      const d=x.last_login||'';return d.startsWith(new Date().toISOString().slice(0,10));
    }).length;

    let html='<div class="stat-row">'+
      '<div class="stat-card"><span class="label">注册商家</span><span class="value">'+stats.total_users+'</span></div>'+
      '<div class="stat-card"><span class="label">经营数据总条数</span><span class="value">'+stats.total_records+'</span></div>'+
      '<div class="stat-card"><span class="label">AI战士就位</span><span class="value">'+stats.soldier_status.total+'</span></div>'+
      '<div class="stat-card"><span class="label">行业基因组</span><span class="value">'+stats.genome_count+'</span></div>'+
    '</div>';

    html+='<div class="section"><h3>📈 行业分布</h3>';
    const inds=stats.industry_stats||{};
    if(Object.keys(inds).length){
      html+='<div class="tag-row">';
      for(const[k,v]of Object.entries(inds)){
        html+='<span class="tag">'+ (TYPE_LABELS[k]||k) +': '+v+'条</span>';
      }
      html+='</div>';
    }else{html+='<p style="color:#6a6a7a;font-size:14px">暂无数据</p>';}
    html+='</div>';

    html+='<div class="section"><h3>👥 最近活跃商家</h3>';
    const recent=u.slice(0,8);
    if(recent.length){
      html+='<table><thead><tr><th>商家昵称</th><th>行业</th><th>数据量</th><th>最后活跃</th><th>注册时间</th></tr></thead><tbody>';
      for(const user of recent){
        html+='<tr onclick="showUserDetail(\''+user.openid+'\')" style="cursor:pointer">'+
          '<td>'+user.nickname+'</td>'+
          '<td><span class="badge blue">'+(TYPE_LABELS[user.store_type]||'未设置')+'</span></td>'+
          '<td><span class="badge green">'+user.record_count+'条</span></td>'+
          '<td>'+user.last_login+'</td>'+
          '<td>'+user.created_at+'</td>'+
        '</tr>';
      }
      html+='</tbody></table>';
    }else{html+='<p style="color:#6a6a7a;font-size:14px">暂无注册商家</p>';}
    html+='</div>';

    $('pageContent').innerHTML=html;
  }catch(e){$('pageContent').innerHTML='<div class="loading">加载失败: '+e.message+'</div>';}
}

async function loadUsers(){
  $('pageTitle').textContent='👥 商家管理';
  try{
    const res=await api('/api/admin/users');
    const users=res.users||[];
    _adminUsers=users;
    let html='';
    if(users.length){
      html+='<table><thead><tr><th>商家昵称</th><th>行业</th><th>数据量</th><th>最后活跃</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
      for(const u of users){
        html+='<tr>'+
          '<td>'+u.nickname+'</td>'+
          '<td><span class="badge blue">'+(TYPE_LABELS[u.store_type]||'未设置')+'</span></td>'+
          '<td><span class="badge green">'+u.record_count+'条</span></td>'+
          '<td>'+u.last_login+'</td>'+
          '<td>'+u.created_at+'</td>'+
          '<td><button onclick="showUserDetail(\''+u.openid+'\')" style="background:rgba(79,195,247,.15);color:#4fc3f7;border:1px solid rgba(79,195,247,.2);border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px">查看数据</button></td>'+
        '</tr>';
      }
      html+='</tbody></table>';
    }else{html='<p style="color:#6a6a7a;font-size:14px;padding:20px">暂无注册商家</p>';}
    $('pageContent').innerHTML='<div class="section"><h3>全部商家 ('+res.total+')</h3>'+html+'</div>';
  }catch(e){$('pageContent').innerHTML='<div class="loading">加载失败: '+e.message+'</div>';}
}

async function showUserDetail(openid){
  try{
    _adminPage = 'detail';
    const res=await api('/api/admin/users/'+openid+'/data');
    const user=res.user||{};
    const records=res.records||[];
    let html='<button class="back-btn" onclick="showPage(\'users\')">← 返回商家列表</button>';
    html+='<div class="section"><h3>👤 '+user.nickname+' ('+openid.slice(0,8)+'...)</h3>';
    html+='<div class="stat-row" style="margin-top:16px">'+
      '<div class="stat-card"><span class="label">行业</span><span class="value" style="font-size:22px">'+(TYPE_LABELS[user.store_type]||'未设置')+'</span></div>'+
      '<div class="stat-card"><span class="label">数据记录</span><span class="value">'+res.record_count+'</span></div>'+
      '<div class="stat-card"><span class="label">注册时间</span><span class="value" style="font-size:18px">'+user.created_at+'</span></div>'+
      '<div class="stat-card"><span class="label">最后活跃</span><span class="value" style="font-size:18px">'+user.last_login+'</span></div>'+
    '</div></div>';

    if(records.length){
      html+='<div class="section"><h3>📊 经营数据记录 ('+records.length+'条)</h3>';
      for(const rec of records){
        const kpiCount=Object.keys(rec.kpi_values||{}).length;
        html+='<div style="background:rgba(15,15,35,.4);border-radius:12px;padding:16px;margin-bottom:12px">'+
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+
          '<div><strong style="color:#4fc3f7;font-size:15px">'+rec.period_label+'</strong>'+
          '<span style="color:#6a6a7a;font-size:12px;margin-left:12px">'+(TYPE_LABELS[rec.store_type]||rec.store_type)+' · '+rec.period_start+' '+rec.period_end+'</span></div>'+
          '<span style="font-size:12px;color:#6a6a7a">'+rec.created_at+'</span></div>';
        if(kpiCount>0){
          html+='<div class="kpi-row">';
          for(const[k,v]of Object.entries(rec.kpi_values||{})){
            let display=v;
            if(typeof v==='number'){
              if(v>=10000)display=(v/10000).toFixed(1)+'w';
              else if(v%1!==0)display=v.toFixed(2);
            }
            html+='<div class="kpi-box"><span class="kpi-name">'+k+'</span><span class="kpi-val">'+display+'</span></div>';
          }
          html+='</div>';
        }
        if(rec.description)html+='<div style="margin-top:8px;font-size:13px;color:#8a8a9a">📝 '+rec.description+'</div>';
        html+='</div>';
      }
      html+='</div>';
    }else{
      html+='<div class="section"><p style="color:#6a6a7a;text-align:center;padding:40px">该商家暂无经营数据</p></div>';
    }
    $('pageTitle').textContent='👤 '+user.nickname;
    $('pageContent').innerHTML=html;
    chatAppend('admin','ai','📋 **'+user.nickname+'** 的经营数据已加载到上方面板\n- 行业：'+(TYPE_LABELS[user.store_type]||'未设置')+'\n- 数据记录：**'+res.record_count+'** 条\n- 注册：'+user.created_at+'\n- 最后活跃：'+user.last_login);
  }catch(e){toast('加载失败: '+e.message);}
}

// ═══════════════════════════════════════════════
// 聊天指挥台（管理后台 v4.0）
// ═══════════════════════════════════════════════
var chatStates = {};
var _adminPage = 'overview';
var _adminUsers = [];

function simpleMarkdown(text) {
  if (!text) return '';
  var html = String(text);
  html = html.replace(/((?:^\|.*\|(?:\n|$)){2,})/gm, function(block){
    var lines = block.trim().split('\n');
    var heads = lines[0].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
    var body = [];
    for (var i=2;i<lines.length;i++){
      if (!lines[i].trim()) continue;
      var cells = lines[i].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
      body.push('<tr>'+cells.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>');
    }
    return '<table><thead><tr>'+heads.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+body.join('')+'</tbody></table>';
  });
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
    return '<pre>' + code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
  });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote style="border-left:3px solid rgba(79,195,247,.5);padding:2px 10px;color:rgba(255,255,255,.6);margin:6px 0;">$1</blockquote>');
  html = html.replace(/(?:^\- .+(?:\n|$))+/gm, function(m){
    var items = m.split('\n').filter(function(l){ return l.trim(); });
    return '<ul style="margin:6px 0;padding-left:18px;">' + items.map(function(i){ return '<li>' + i.replace(/^\- /,'') + '</li>'; }).join('') + '</ul>';
  });
  html = html.replace(/(?:^\d+\. .+(?:\n|$))+/gm, function(m){
    var items = m.split('\n').filter(function(l){ return l.trim(); });
    return '<ol style="margin:6px 0;padding-left:18px;">' + items.map(function(i){ return '<li>' + i.replace(/^\d+\. /,'') + '</li>'; }).join('') + '</ol>';
  });
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^### (.+)$/gm, '<h5 style="margin:8px 0 4px;">$1</h5>');
  html = html.replace(/^## (.+)$/gm, '<h4 style="margin:8px 0 4px;">$1</h4>');
  html = html.replace(/^# (.+)$/gm, '<h3 style="margin:8px 0 4px;">$1</h3>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function chatInit(viewId, welcome, quicks) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  box.innerHTML = '';
  chatAppend(viewId, 'ai', welcome);
  chatRenderQuick(viewId, quicks);
}

function chatAppend(viewId, role, content) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var msg = document.createElement('div');
  msg.className = 'chat-msg ' + role;
  msg.innerHTML = '<div class="chat-mini-avatar">' + (role === 'ai' ? '🤖' : '🧑') + '</div><div class="chat-bubble">' + (role === 'ai' ? simpleMarkdown(content) : content) + '</div>';
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

function chatAppendHtml(viewId, html) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var msg = document.createElement('div');
  msg.className = 'chat-msg ai';
  msg.innerHTML = '<div class="chat-mini-avatar">🤖</div><div class="chat-bubble">' + html + '</div>';
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

function chatTyping(viewId, on) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var t = document.getElementById('chat-typing-' + viewId);
  if (on) {
    if (t) return;
    var d = document.createElement('div');
    d.className = 'chat-msg ai';
    d.id = 'chat-typing-' + viewId;
    d.innerHTML = '<div class="chat-mini-avatar">🤖</div><div class="chat-bubble"><div class="chat-typing"><i></i><i></i><i></i></div></div>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  } else if (t) { t.remove(); }
}

function chatRenderQuick(viewId, quicks) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (quicks || []).forEach(function(it) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (it.hot ? ' hot' : '');
    s.textContent = it.label;
    s.onclick = function() { chatSendText(viewId, it.send); };
    q.appendChild(s);
  });
}

function chatChips(viewId, chips) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (chips || []).forEach(function(c) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (c.hot ? ' hot' : '');
    s.textContent = c.label;
    s.onclick = function() { chatSendText(viewId, c.send); };
    q.appendChild(s);
  });
}

function chatSend(viewId) {
  var input = document.getElementById('chat-input-' + viewId);
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  chatSendText(viewId, text);
}

function chatSendText(viewId, text) {
  chatAppend(viewId, 'user', esc(text));
  chatTyping(viewId, true);
  chatDispatch(viewId, text).finally(function() { chatTyping(viewId, false); });
}

async function chatDispatch(viewId, text) {
  text = (text || '').trim();
  if (!text) return;
  if (_adminPage === 'users') return chatAdminUsers(text);
  if (_adminPage === 'detail') return chatAdminDetail(text);
  return chatAdminOverview(text);
}

function chatContext() {
  var cfg = {
    overview: {
      welcome: '📊 当前在 **系统概览**\n- **刷新数据** / **查看统计**\n- **列出商家** 前往商家管理',
      quicks: [{label:'🔄 刷新数据', send:'刷新数据', hot:true}, {label:'📈 查看统计', send:'查看统计'}, {label:'👥 列出商家', send:'列出商家'}]
    },
    users: {
      welcome: '👥 当前在 **商家管理**\n- **列出商家** / **搜索 XX**\n- **查看 XX** 看商家经营数据',
      quicks: [{label:'👥 列出商家', send:'列出商家', hot:true}, {label:'🔍 搜索', send:'搜索'}]
    },
    detail: {
      welcome: '👤 当前在 **商家详情**\n- 输入商家**昵称**或 openid 切换查看\n- **返回列表**',
      quicks: [{label:'↩️ 返回商家列表', send:'返回列表', hot:true}]
    }
  };
  var c = cfg[_adminPage] || cfg.overview;
  chatAppend('admin', 'ai', c.welcome);
  chatRenderQuick('admin', c.quicks);
}

async function chatAdminOverview(text) {
  var v = 'admin';
  if (/刷新|更新|最新/.test(text)) {
    await loadOverview();
    chatAppend(v, 'ai', '✅ 系统概览已刷新');
    return;
  }
  if (/统计|概览|平台|多少/.test(text)) {
    var cards = document.querySelectorAll('#pageContent .stat-card');
    var lines = [];
    cards.forEach(function(c) {
      var l = c.querySelector('.label');
      var val = c.querySelector('.value');
      if (l && val) lines.push('- **' + l.textContent + '**：' + val.textContent);
    });
    chatAppend(v, 'ai', '📈 **平台概览：**\n' + (lines.join('\n') || '（请先刷新数据）'));
    return;
  }
  if (/商家|列表|前往/.test(text)) {
    showPage('users');
    return;
  }
  chatAppend(v, 'ai', '你可以对我说：\n- **刷新数据**：更新系统概览\n- **查看统计**：平台整体情况\n- **列出商家**：前往商家管理');
}

async function chatAdminUsers(text) {
  var v = 'admin';
  if (/刷新|最新|列表|列出|所有/.test(text)) {
    await loadUsers();
    var md = '👥 **商家列表（共 ' + _adminUsers.length + ' 家）：**\n\n';
    _adminUsers.forEach(function(u, i) {
      md += (i + 1) + '. **' + u.nickname + '** · ' + (TYPE_LABELS[u.store_type] || '未设置') + ' · ' + u.record_count + '条数据 · 最后活跃 ' + u.last_login + '\n';
    });
    md += '\n对某商家说"**查看 昵称**"看详细经营数据';
    chatAppend(v, 'ai', md);
    return;
  }
  if (/搜索|找|查找/.test(text)) {
    var kw = text.replace(/^(搜索|找|查找|帮我找|搜)\s*/i, '').trim();
    var hits = _adminUsers.filter(function(u) {
      return !kw || (u.nickname || '').indexOf(kw) >= 0 || (u.openid || '').indexOf(kw) >= 0;
    });
    if (!hits.length) { chatAppend(v, 'ai', '没有找到匹配 **' + kw + '** 的商家'); return; }
    var md = '🔍 找到 **' + hits.length + '** 家商家：\n\n';
    hits.forEach(function(u, i) { md += (i + 1) + '. **' + u.nickname + '** · ' + u.record_count + '条数据 · `' + u.openid + '`\n'; });
    chatAppend(v, 'ai', md);
    return;
  }
  if (/查看|详情|数据/.test(text)) {
    var name = text.replace(/^(查看|详情|看|看看|查|数据|看看)\s*/i, '').trim();
    var u = findAdminUser(name);
    if (u) { await showUserDetail(u.openid); return; }
    chatAppend(v, 'ai', '没找到 **' + name + '**，试试"搜索 ' + name + '"');
    return;
  }
  chatAppend(v, 'ai', '商家管理支持：\n- **列出商家**\n- **搜索 XX**\n- **查看 XX**（商家昵称或 openid）');
}

async function chatAdminDetail(text) {
  var v = 'admin';
  if (/返回|列表|回/.test(text)) { showPage('users'); return; }
  var u = findAdminUser(text);
  if (u) { await showUserDetail(u.openid); return; }
  if (text.length >= 6) { await showUserDetail(text); return; }
  chatAppend(v, 'ai', '输入商家**昵称**或 openid 查看经营数据，或说"**返回列表**"。');
}

function findAdminUser(kw) {
  if (!kw) return null;
  for (var i = 0; i < _adminUsers.length; i++) {
    var u = _adminUsers[i];
    if (u.nickname && u.nickname.indexOf(kw) >= 0) return u;
    if (u.openid && u.openid.indexOf(kw) >= 0) return u;
  }
  return null;
}

function initChatAdmin() {
  chatInit('admin', '我是你的 **管理后台助手** 🎖️\n- **刷新数据**：更新系统概览\n- **查看统计**：平台整体情况\n- **列出商家**：前往商家管理', [
    {label:'🔄 刷新数据', send:'刷新数据', hot:true},
    {label:'📈 查看统计', send:'查看统计'},
    {label:'👥 列出商家', send:'列出商家'},
  ]);
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Init
if(adminToken){
  api('/api/admin/check').then(d=>{
    if(d.status==='success'){
      $('loginScreen').classList.add('hidden');
      $('app').classList.remove('hidden');
      initChatAdmin();
      showPage('overview');
    }else{logout(true)}
  }).catch(()=>logout(true));
}
</script>
