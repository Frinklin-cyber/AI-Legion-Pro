<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台管理 - AI军团</title>
<style>
:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --card: rgba(24, 24, 32, 0.88);
  --accent: #e8b64c;
  --accent2: #f7dc8d;
  --danger: #ff5c5c;
  --success: #46d48a;
  --warning: #ffb84d;
  --text: #ece9e1;
  --text1: #cbc5b5;
  --text2: #8f8a7c;
  --border: rgba(232, 182, 76, 0.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(232, 182, 76, 0.07), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(70, 212, 138, 0.05), transparent 55%),
    linear-gradient(180deg, #0a0a0f 0%, #0d0d14 100%);
  background-attachment: fixed;
  color: var(--text); min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(232, 182, 76, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232, 182, 76, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
}
body::after {
  content: ''; position: fixed; top: 0; left: 0; width: 220px; height: 2px;
  z-index: 9999; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(247, 220, 141, 0.85), transparent);
  animation: scanline 7s linear infinite;
}
@keyframes scanline {
  0% { transform: translateX(-220px); }
  100% { transform: translateX(calc(100vw + 220px)); }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(232, 182, 76, 0.22); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(232, 182, 76, 0.4); }
::-webkit-scrollbar-track { background: transparent; }

/* ── 侧边栏 · 金属指挥台 ── */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 240px;
  background: linear-gradient(180deg, rgba(17, 17, 24, 0.98), rgba(10, 10, 15, 0.98));
  border-right: 1px solid var(--border); padding: 0 0 80px; z-index: 10;
  box-shadow: 6px 0 30px rgba(0, 0, 0, 0.55);
}
.sidebar::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #b8860b, #f7dc8d, #b8860b);
}
.sidebar-logo { padding: 24px 20px 18px; border-bottom: 1px solid var(--border); }
.logo-badge { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px;
  background: linear-gradient(160deg, rgba(232, 182, 76, 0.2), rgba(232, 182, 76, 0.05));
  border: 1px solid rgba(232, 182, 76, 0.45); border-radius: 10px;
  box-shadow: inset 0 0 16px rgba(232, 182, 76, 0.25), 0 0 12px rgba(232, 182, 76, 0.15);
}
.logo-text h1 { font-size: 19px; color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 1px; margin: 0; padding: 0; }
.logo-text h1::before { display: none; }
.pro-tag {
  font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #171003;
  background: linear-gradient(135deg, #f7dc8d, #e8b64c); padding: 2px 7px; border-radius: 4px;
  box-shadow: 0 0 10px rgba(232, 182, 76, 0.5);
}
.logo-text span { display: block; font-size: 10px; color: var(--accent2); letter-spacing: 2.5px; margin-top: 3px; text-transform: uppercase; opacity: 0.9; }
.sidebar h2 { padding: 24px 20px 18px; font-size: 18px; color: #fff; border-bottom: 1px solid var(--border); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: 1px; }
.sidebar h2 span { color: var(--accent); }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 20px; text-align: left;
  border: none; background: none; color: var(--text2); font-size: 14px; cursor: pointer;
  transition: all 0.2s; border-left: 3px solid transparent; font-family: inherit;
  letter-spacing: 0.5px; user-select: none; position: relative;
}
.nav-item:hover { color: #fff; background: rgba(232, 182, 76, 0.06); border-left-color: rgba(232, 182, 76, 0.5); }
.nav-item.active {
  color: var(--accent2); background: linear-gradient(90deg, rgba(232, 182, 76, 0.15), transparent 85%);
  border-left-color: var(--accent); font-weight: 600; text-shadow: 0 0 14px rgba(232, 182, 76, 0.35);
}
.user-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 20px; border-top: 1px solid var(--border); background: rgba(10, 10, 15, 0.92); }
.user-info .name { color: #fff; font-size: 14px; font-weight: 600; }
.user-info .action { color: var(--danger); font-size: 12px; cursor: pointer; margin-top: 4px; transition: .2s; }
.user-info .action:hover { text-shadow: 0 0 10px rgba(255, 92, 92, 0.5); }

/* ── 主区域 ── */
.main { margin-left: 240px; padding: 30px; position: relative; z-index: 1; }
.panel { display: none; }
.panel.active { display: block; animation: viewIn 0.3s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
h3 {
  font-size: 20px; margin-bottom: 20px; color: #fff; letter-spacing: 1px;
  padding-left: 14px; position: relative;
}
h3::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 20px; background: linear-gradient(180deg, #f7dc8d, #b8860b);
  box-shadow: 0 0 8px rgba(232, 182, 76, 0.6); border-radius: 2px;
}

/* ── 指标卡 · 金盾数据屏 ── */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
  position: relative; overflow: hidden; transition: .25s;
}
.stat-card:hover {
  transform: translateY(-2px); border-color: rgba(232, 182, 76, 0.35);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(232, 182, 76, 0.06);
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
  background: linear-gradient(180deg, #f7dc8d, #b8860b); opacity: 0.7;
}
.stat-card .label { color: var(--text2); font-size: 13px; margin-bottom: 8px; letter-spacing: .5px; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--accent); text-shadow: 0 0 18px rgba(232, 182, 76, 0.35); }
.stat-card .value.green { color: var(--success); text-shadow: 0 0 18px rgba(70, 212, 138, 0.3); }

/* ── 搜索栏 ── */
.search-bar { margin-bottom: 16px; display: flex; gap: 8px; }
.search-bar input {
  flex: 1; padding: 9px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
  color: var(--text); font-size: 14px; outline: none; transition: .2s;
}
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.12); }
.search-bar button {
  padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 14px; color: #171003; background: linear-gradient(135deg, #b8860b, #e8b64c); font-weight: 600; transition: .2s;
}
.search-bar button:hover { box-shadow: 0 4px 18px rgba(232, 182, 76, 0.35); }

/* ── 表格 ── */
.table-wrap { background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid rgba(232, 182, 76, 0.08); font-size: 14px; }
th { color: var(--accent2); font-weight: 600; background: rgba(232, 182, 76, 0.05); letter-spacing: .5px; }
td { color: var(--text1); }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(232, 182, 76, 0.04); }
.badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-active { background: rgba(70, 212, 138, 0.15); color: #46d48a; }
.badge-disabled { background: rgba(255, 92, 92, 0.15); color: #ff5c5c; }
.badge-ai { background: rgba(232, 182, 76, 0.15); color: var(--accent2); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-admin { background: rgba(232, 182, 76, 0.2); color: var(--accent2); }
.tag-operator { background: rgba(70, 212, 138, 0.2); color: #46d48a; }
.tag-viewer { background: rgba(143, 138, 124, 0.2); color: var(--text1); }

/* ── 按钮 ── */
.btn { padding: 7px 18px; border-radius: 7px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: .2s; color: #fff; font-family: inherit; }
.btn-primary { background: linear-gradient(135deg, #b8860b, #e8b64c); color: #171003; }
.btn-primary:hover { box-shadow: 0 4px 18px rgba(232, 182, 76, 0.35); }
.btn-danger { background: rgba(255, 92, 92, 0.12); color: #ff5c5c; border: 1px solid rgba(255, 92, 92, 0.35); }
.btn-danger:hover { background: rgba(255, 92, 92, 0.28); }
.btn-sm { padding: 4px 12px; font-size: 12px; }

/* ── 分页 ── */
.pagination { display: flex; justify-content: center; gap: 8px; padding: 16px; }
.pagination button {
  padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
  background: none; color: var(--text2); cursor: pointer; font-size: 13px; transition: .2s;
}
.pagination button:hover { background: rgba(232, 182, 76, 0.1); color: var(--accent2); }

/* ── 空状态 / 详情卡 ── */
.empty { text-align: center; color: var(--text2); padding: 40px; font-size: 14px; letter-spacing: .5px; }
.detail-card { background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid var(--border); margin-bottom: 16px; }
.detail-card h4 { color: #fff; margin-bottom: 12px; font-size: 16px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.detail-grid .item .l { color: var(--text2); font-size: 12px; }
.detail-grid .item .v { color: var(--text1); font-size: 14px; margin-top: 2px; }

/* ── 登录界面（平台管理） ── */
.login-box { display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative; z-index: 1; }
.login-card {
  width: 380px; padding: 44px 40px; position: relative;
  background: linear-gradient(180deg, rgba(18, 18, 26, 0.92), rgba(10, 10, 15, 0.96));
  border: 1px solid var(--border); border-radius: 16px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(247, 220, 141, 0.08);
}
.login-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #b8860b, #f7dc8d, #b8860b);
}
.login-card h1 { color: #fff; text-align: center; margin-bottom: 24px; font-size: 22px; letter-spacing: 1px; }
.login-card input {
  width: 100%; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px;
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
  color: var(--text); font-size: 14px; outline: none; transition: .2s;
}
.login-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.12); }
.login-card input::placeholder { color: rgba(143, 138, 124, 0.5); }
.login-card .login-btn {
  width: 100%; padding: 13px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 15px; font-weight: 700; letter-spacing: 4px; margin-top: 8px;
  background: linear-gradient(135deg, #b8860b, #e8b64c 55%, #f7dc8d); color: #171003; transition: .25s;
}
.login-card .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(232, 182, 76, 0.35); }
.login-card .error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; }

/* ── Toast ── */
.toast {
  position: fixed; top: 20px; right: 20px; padding: 12px 24px; border-radius: 8px;
  font-size: 14px; z-index: 1000; animation: slideIn .3s; display: none; letter-spacing: .5px;
  border: 1px solid;
}
.toast.success { background: rgba(6, 78, 59, 0.95); color: #6ee7b7; border-color: rgba(70, 212, 138, 0.4); }
.toast.error { background: rgba(127, 29, 29, 0.95); color: #fca5a5; border-color: rgba(255, 92, 92, 0.4); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── 聊天指挥台 ── */
.chat-panel {
  margin-top: 24px; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
.chat-panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, #b8860b, #f7dc8d, #b8860b); opacity: 0.7;
}
.chat-panel-header {
  padding: 13px 18px; border-bottom: 1px solid rgba(232, 182, 76, 0.12);
  color: var(--accent2); font-size: 14px; font-weight: 600; letter-spacing: .5px;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(90deg, rgba(232, 182, 76, 0.08), transparent);
}
.chat-box { flex: 1; overflow-y: auto; padding: 16px; min-height: 240px; max-height: 420px; display: flex; flex-direction: column; gap: 12px; }
.chat-msg { display: flex; gap: 10px; align-items: flex-start; }
.chat-msg.user { flex-direction: row-reverse; }
.chat-mini-avatar {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px;
  background: rgba(232, 182, 76, 0.15); border: 1px solid rgba(232, 182, 76, 0.3);
}
.chat-msg.user .chat-mini-avatar { background: rgba(70, 212, 138, 0.15); border-color: rgba(70, 212, 138, 0.3); }
.chat-bubble {
  max-width: 82%; padding: 10px 14px; border-radius: 12px;
  background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(232, 182, 76, 0.1);
  color: var(--text1); font-size: 13px; line-height: 1.65; word-break: break-word;
}
.chat-msg.user .chat-bubble { background: rgba(232, 182, 76, 0.12); border-color: rgba(232, 182, 76, 0.25); color: var(--text); }
.chat-bubble pre { background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; font-size: 12px; border: 1px solid rgba(232, 182, 76, 0.1); }
.chat-bubble code { font-family: Consolas, monospace; color: var(--accent2); }
.chat-bubble table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px; }
.chat-bubble th, .chat-bubble td { border: 1px solid rgba(232, 182, 76, 0.15); padding: 4px 8px; text-align: left; }
.chat-bubble th { background: rgba(232, 182, 76, 0.08); color: var(--accent2); }
.chat-bubble a { color: var(--accent2); }
.chat-bubble p { margin: 4px 0; }
.chat-quick { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
.chat-chip {
  padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(232, 182, 76, 0.3);
  background: rgba(232, 182, 76, 0.08); color: var(--accent2); font-size: 12px;
  cursor: pointer; transition: .2s; user-select: none;
}
.chat-chip:hover { background: rgba(232, 182, 76, 0.2); }
.chat-chip.hot { background: rgba(232, 182, 76, 0.18); border-color: var(--accent); color: #f7dc8d; font-weight: 600; }
.chat-input-row { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid rgba(232, 182, 76, 0.12); background: rgba(0, 0, 0, 0.15); }
.chat-input {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
  color: #fff; font-size: 13px; outline: none; transition: .2s;
}
.chat-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.1); }
.chat-typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.chat-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); animation: chatBlink 1s infinite; }
.chat-typing i:nth-child(2) { animation-delay: .2s; }
.chat-typing i:nth-child(3) { animation-delay: .4s; }
@keyframes chatBlink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
.chat-act {
  display: inline-block; margin-top: 6px; padding: 6px 14px; border-radius: 8px;
  border: 1px solid rgba(232, 182, 76, 0.4); background: rgba(232, 182, 76, 0.12);
  color: var(--accent2); font-size: 12px; cursor: pointer; transition: .2s;
}
.chat-act:hover { background: rgba(232, 182, 76, 0.25); }
.chat-act.danger { border-color: rgba(255, 92, 92, 0.4); background: rgba(255, 92, 92, 0.12); color: #fca5a5; }
.chat-act.danger:hover { background: rgba(255, 92, 92, 0.25); }
.chat-act.green { border-color: rgba(70, 212, 138, 0.4); background: rgba(70, 212, 138, 0.12); color: #6ee7b7; }

/* ── 地区选择器 ── */
.region-trigger {
  width: 100%; padding: 8px 12px; border-radius: 6px;
  border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03);
  color: var(--text); font-size: 14px; cursor: pointer; text-align: left;
  transition: .2s; user-select: none;
}
.region-trigger:hover { border-color: var(--accent); }
.region-trigger.placeholder { color: rgba(143, 138, 124, 0.5); }
.region-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); z-index: 1000; align-items: center; justify-content: center; }
.region-overlay.show { display: flex; }
.region-picker {
  background: linear-gradient(180deg, #15151d, #0d0d14); border-radius: 16px; width: 680px; max-width: 95vw;
  max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.region-picker .rp-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.region-picker .rp-header h4 { color: #fff; font-size: 16px; margin: 0; letter-spacing: .5px; }
.region-picker .rp-header .rp-close {
  width: 28px; height: 28px; border-radius: 6px; border: none;
  background: rgba(255, 255, 255, 0.08); color: var(--text2);
  cursor: pointer; font-size: 16px; transition: .2s;
}
.region-picker .rp-header .rp-close:hover { background: rgba(255, 92, 92, 0.3); color: #ff5c5c; }
.region-picker .rp-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 16px; gap: 4px; }
.region-picker .rp-tab { padding: 10px 16px; border: none; background: none; color: var(--text2); font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: .2s; }
.region-picker .rp-tab:hover { color: var(--text); }
.region-picker .rp-tab.active { color: var(--accent2); border-bottom-color: var(--accent); }
.region-picker .rp-tab:disabled { opacity: 0.4; cursor: not-allowed; }
.region-picker .rp-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 240px; max-height: 50vh; }
.region-picker .rp-body::-webkit-scrollbar { width: 4px; }
.region-picker .rp-body::-webkit-scrollbar-thumb { background: rgba(232, 182, 76, 0.2); border-radius: 2px; }
.region-picker .rp-col { display: none; flex-wrap: wrap; gap: 0; align-content: flex-start; }
.region-picker .rp-col.active { display: flex; }
.region-picker .rp-item {
  padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
  color: var(--text1); transition: .15s; white-space: nowrap;
  border: 1px solid transparent; margin: 2px;
}
.region-picker .rp-item:hover { background: rgba(232, 182, 76, 0.1); color: #fff; }
.region-picker .rp-item.sel { background: rgba(232, 182, 76, 0.2); color: var(--accent2); border-color: rgba(232, 182, 76, 0.35); font-weight: 600; }
.region-picker .rp-empty { color: var(--text2); font-size: 13px; padding: 20px; text-align: center; width: 100%; }
.region-picker .rp-breadcrumb { display: flex; gap: 4px; align-items: center; padding: 8px 16px; font-size: 12px; color: var(--text2); flex-wrap: wrap; }
.region-picker .rp-breadcrumb span { cursor: pointer; color: var(--text2); }
.region-picker .rp-breadcrumb span:hover { color: var(--accent); }
.region-picker .rp-breadcrumb span.cur { color: var(--accent2); cursor: default; font-weight: 500; }
</style>
</head>
<body>

<!-- 登录界面 -->
<div id="login-screen" class="login-box">
  <div class="login-card">
    <h1>🛡️ 平台管理后台</h1>
    <input type="text" id="adm-user" placeholder="管理员账号" value="admin">
    <input type="password" id="adm-pass" placeholder="管理员密码" value="admin123" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="login-btn" onclick="adminLogin()">登 录</button>
    <div class="error" id="login-error"></div>
  </div>
</div>

<!-- 管理界面 -->
<div id="main-screen" style="display:none">
  <div class="sidebar">
      <div class="sidebar-logo">
    <div class="logo-badge">
      <div class="logo-icon">🛡️</div>

async function adminLogin() {

    setLoginError(d?.detail || '管理员账号或密码错误');
  }
}

function setLoginError(msg) {

}

function adminLogout() {

  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
}

async function api(method, url) {
  var sep = url.includes('?') ? '&' : '?';
  var r = await fetch(url + sep + authParam, { method: method });

}

  if (search) url += '&search=' + encodeURIComponent(search);

  _merchantsPage = page || 1;
  var html = '<table><thead><tr><th>商家名称</th><th>账号</th><th>电话</th><th>地区</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead><tbody>';
  if (d.data.length === 0) html += '<tr><td colspan="7" class="empty">暂无商家</td></tr>';
  d.data.forEach(function(m){

    var toggleBtn = m.is_active

      : '<button class="btn btn-primary btn-sm" onclick="toggleMerchant(\''+m.tenant_id+'\',\'enable\')">启用</button>';

function esc(s) {
  if (!s) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════════
// 聊天指挥台（平台管理）
// ═══════════════════════════════════════════════
var chatStates = {};

function simpleMarkdown(text) {
  if (!text) return '';
  var html = String(text);
  html = html.replace(/((?:^\|.*\|(?:\n|$)){2,})/gm, function(block){
    var lines = block.trim().split('\n');
    var heads = lines[0].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
    var body = [];
    for (var i=2;i<lines.length;i++){
      if (!lines[i].trim()) continue;
      var cells = lines[i].replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});
      body.push('<tr>'+cells.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>');
    }
    return '<table><thead><tr>'+heads.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>'+body.join('')+'</tbody></table>';
  });
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
    return '<pre>' + code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre>';
  });
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote style="border-left:3px solid rgba(232,182,76,0.5);padding:2px 10px;color:rgba(255,255,255,0.6);margin:6px 0;">$1</blockquote>');
  html = html.replace(/(?:^\- .+(?:\n|$))+/gm, function(m){
    var items = m.split('\n').filter(function(l){ return l.trim(); });
    return '<ul style="margin:6px 0;padding-left:18px;">' + items.map(function(i){ return '<li>' + i.replace(/^\- /,'') + '</li>'; }).join('') + '</ul>';
  });
  html = html.replace(/(?:^\d+\. .+(?:\n|$))+/gm, function(m){
    var items = m.split('\n').filter(function(l){ return l.trim(); });
    return '<ol style="margin:6px 0;padding-left:18px;">' + items.map(function(i){ return '<li>' + i.replace(/^\d+\. /,'') + '</li>'; }).join('') + '</ol>';
  });
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  html = html.replace(/^### (.+)$/gm, '<h5 style="margin:8px 0 4px;">$1</h5>');
  html = html.replace(/^## (.+)$/gm, '<h4 style="margin:8px 0 4px;">$1</h4>');
  html = html.replace(/^# (.+)$/gm, '<h3 style="margin:8px 0 4px;">$1</h3>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

function chatInit(viewId, welcome, quicks) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  box.innerHTML = '';
  chatAppend(viewId, 'ai', welcome);
  chatRenderQuick(viewId, quicks);
}

function chatAppend(viewId, role, content) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var msg = document.createElement('div');
  msg.className = 'chat-msg ' + role;
  msg.innerHTML = '<div class="chat-mini-avatar">' + (role === 'ai' ? '🤖' : '🧑') + '</div><div class="chat-bubble">' + (role === 'ai' ? simpleMarkdown(content) : content) + '</div>';
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

function chatAppendHtml(viewId, html) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var msg = document.createElement('div');
  msg.className = 'chat-msg ai';
  msg.innerHTML = '<div class="chat-mini-avatar">🤖</div><div class="chat-bubble">' + html + '</div>';
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

function chatTyping(viewId, on) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var t = document.getElementById('chat-typing-' + viewId);
  if (on) {
    if (t) return;
    var d = document.createElement('div');
    d.className = 'chat-msg ai';
    d.id = 'chat-typing-' + viewId;
    d.innerHTML = '<div class="chat-mini-avatar">🤖</div><div class="chat-bubble"><div class="chat-typing"><i></i><i></i><i></i></div></div>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  } else if (t) { t.remove(); }
}

function chatRenderQuick(viewId, quicks) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (quicks || []).forEach(function(it) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (it.hot ? ' hot' : '');
    s.textContent = it.label;
    s.onclick = function() { chatSendText(viewId, it.send); };
    q.appendChild(s);
  });
}

function chatChips(viewId, chips) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (chips || []).forEach(function(c) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (c.hot ? ' hot' : '');
    s.textContent = c.label;
    s.onclick = function() { chatSendText(viewId, c.send); };
    q.appendChild(s);
  });
}

function chatSend(viewId) {
  var input = document.getElementById('chat-input-' + viewId);
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  chatSendText(viewId, text);
}

function chatSendText(viewId, text) {
  chatAppend(viewId, 'user', esc(text));
  chatTyping(viewId, true);
  chatDispatch(viewId, text).finally(function() { chatTyping(viewId, false); });
}

async function chatDispatch(viewId, text) {
  text = (text || '').trim();
  if (!text) return;
  if (viewId === 'overview') return chatOverview(text);
  if (viewId === 'merchants') return chatMerchants(text);
  if (viewId === 'detail') return chatDetail(text);
}

// ── 系统概览聊天 ──
async function chatOverview(text) {
  var v = 'overview';
  if (/刷新|更新|最新/.test(text)) {
    await loadOverview();
    chatAppend(v, 'ai', '✅ 系统统计已刷新');
    return;
  }
  if (/统计|概览|平台|商家数/.test(text)) {
    var cards = document.querySelectorAll('#overview-stats .stat-card');
    var lines = [];
    cards.forEach(function(c){
      var l = c.querySelector('.label');
      var val = c.querySelector('.value');
      if (l && val) lines.push('- **' + l.textContent + '**：' + val.textContent);
    });
    chatAppend(v, 'ai', '📈 **平台概览：**\n' + lines.join('\n'));
    return;
  }
  if (/商家|列表|列表页/.test(text)) {
    switchPanel('merchants');
    chatAppend(v, 'ai', '已切换到**商家列表**，可以输入：\n- **列出商家**\n- **搜索 XX**\n- **禁用 / 启用 XX**');
    return;
  }
  chatAppend(v, 'ai', '你可以对我说：\n- **刷新数据**：更新系统统计\n- **查看统计**：平台整体概览\n- **列出商家**：前往商家列表');
  chatRenderQuick(v, [
    {label:'🔄 刷新数据', send:'刷新数据', hot:true},
    {label:'📈 查看统计', send:'查看统计'},
    {label:'🏪 列出商家', send:'列出商家'},
  ]);
}

function switchPanel(panel) {
  document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
  var nav = document.querySelector('[data-panel="' + panel + '"]');
  if (nav) nav.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  var el = document.getElementById('panel-' + panel);
  if (el) el.classList.add('active');
}

// ── 商家列表聊天 ──
async function chatMerchants(text) {
  var v = 'merchants';
  if (/刷新|最新|第一页|首页/.test(text)) {
    await loadMerchants(1);
    chatAppend(v, 'ai', '✅ 商家列表已刷新');
    return;
  }
  if (/下一页|更多/.test(text)) {
    await loadMerchants(_merchantsPage + 1);
    chatAppend(v, 'ai', '📄 已加载第 **' + _merchantsPage + '** 页（' + _merchants.length + ' 条）');
    return;
  }
  if (/上一页/.test(text)) {
    if (_merchantsPage <= 1) { chatAppend(v, 'ai', '已经是第一页啦'); return; }
    await loadMerchants(_merchantsPage - 1);
    chatAppend(v, 'ai', '📄 已回到第 **' + _merchantsPage + '** 页');
    return;
  }
  if (/搜索|查找|找/.test(text)) {
    var kw = text.replace(/^(搜索|查找|找|帮我找|搜一下|搜)\s*/i, '').trim();
    if (kw) { await loadMerchants(1, kw); chatAppend(v, 'ai', '🔍 搜索 **' + kw + '** 的结果已显示在上方表格（' + _merchants.length + ' 条）'); return; }
  }
  if (/禁用|停用|封禁/.test(text)) {
    var kw2 = text.replace(/^(禁用|停用|封禁|把)\s*/i, '').replace(/[了。！!？?]$/g, '').trim();
    var hit = findMerchant(kw2);
    if (hit) { await toggleMerchant(hit.tenant_id, 'disable'); return; }
    chatAppend(v, 'ai', '没在当前列表找到 **' + kw2 + '**，试试搜"搜索 ' + kw2 + '"先定位商家');
    return;
  }
  if (/启用|恢复/.test(text)) {
    var kw3 = text.replace(/^(启用|恢复|把)\s*/i, '').replace(/[了。！!？?]$/g, '').trim();
    var hit3 = findMerchant(kw3);
    if (hit3) { await toggleMerchant(hit3.tenant_id, 'enable'); return; }
    chatAppend(v, 'ai', '没在当前列表找到 **' + kw3 + '**');
    return;
  }
  if (/详情|查看/.test(text)) {
    var kw4 = text.replace(/^(详情|查看|看看|看)\s*/i, '').trim();
    if (kw4) { switchPanel('detail'); await viewDetail(kw4); return; }
  }
  if (/列出|列表|所有|总览/.test(text)) {
    await loadMerchants(1);
    var md = '🏪 **商家列表（第 ' + _merchantsPage + ' 页 · ' + _merchants.length + ' 条）：**\n\n';
    _merchants.forEach(function(m, i) {
      md += (i + 1) + '. **' + m.name + '** · ' + m.account + ' · ' + (m.is_active ? '✅已启用' : '🚫已禁用') + '\n';
    });
    md += '\n对某个商家说"**详情 ' + (_merchants[0] ? _merchants[0].tenant_id : 'tid_xxx') + '**"可查看详情';
    chatAppend(v, 'ai', md);
    return;
  }
  chatAppend(v, 'ai', '商家管理支持：\n- **列出商家** / **搜索 XX**\n- **禁用 XX / 启用 XX**（名称或账号）\n- **详情 XX**（Tenant ID）\n- **下一页 / 上一页**');
  chatRenderQuick(v, [
    {label:'🏪 列出商家', send:'列出商家', hot:true},
    {label:'🔍 搜索商家', send:'搜索'},
    {label:'⏭ 下一页', send:'下一页'},
  ]);
}

function findMerchant(kw) {
  if (!kw) return null;
  for (var i = 0; i < _merchants.length; i++) {
    var m = _merchants[i];
    if (m.name && m.name.indexOf(kw) >= 0) return m;
    if (m.account && m.account.indexOf(kw) >= 0) return m;
    if (m.tenant_id && m.tenant_id.indexOf(kw) >= 0) return m;
  }
  return null;
}

// ── 商家详情聊天 ──
async function chatDetail(text) {
  var v = 'detail';
  var tid = text.replace(/^(详情|查看|看看|看|查)\s*/i, '').trim();
  if (tid) { await viewDetail(tid); return; }
  chatAppend(v, 'ai', '输入商家的 **Tenant ID** 即可查看详情，例如：\n`tid_xxx`\n也可以在商家列表点名称跳转。');
  chatRenderQuick(v, [
    {label:'🏪 返回商家列表', send:'列出商家', hot:true},
  ]);
}

// 初始化所有聊天窗口
function initChats() {
  chatInit('overview', '我是你的 **平台管理助手** 🛡️\n- **刷新数据**：更新系统统计\n- **查看统计**：平台整体概览\n- **列出商家**：前往商家列表', [
    {label:'🔄 刷新数据', send:'刷新数据', hot:true},
    {label:'📈 查看统计', send:'查看统计'},
    {label:'🏪 列出商家', send:'列出商家'},
  ]);
  chatInit('merchants', '我是你的 **商家管理助手** 🏪\n- **列出商家** / **搜索 XX**\n- **禁用 / 启用 XX**（名称或账号）\n- **详情 XX**（Tenant ID）', [
    {label:'🏪 列出商家', send:'列出商家', hot:true},
    {label:'🔍 搜索商家', send:'搜索'},
    {label:'⏭ 下一页', send:'下一页'},
  ]);
  chatInit('detail', '我是你的 **商家详情助手** 🔍\n输入 **Tenant ID** 即可查看商家详情、员工列表与使用记录。', [
    {label:'🏪 返回商家列表', send:'列出商家', hot:true},
  ]);
}
