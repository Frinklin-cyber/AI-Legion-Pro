<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎖️ AI军团指挥中心</title>
<style>
/* ============================================================
   AI军团 PRO · 金盾战术指挥中心 v3.0
   黑金军事指挥风 —— 与普通版（蓝白知识大脑）完全区隔
   ============================================================ */
:root {
  --bg: #0a0a0f;
  --panel: #12121a;
  --card: rgba(24, 24, 32, 0.88);
  --accent: #e8b64c;
  --accent2: #f7dc8d;
  --danger: #ff5c5c;
  --success: #46d48a;
  --warning: #ffb84d;
  --text: #ece9e1;
  --text1: #cbc5b5;
  --text2: #8f8a7c;
  --border: rgba(232, 182, 76, 0.16);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, rgba(232, 182, 76, 0.07), transparent 60%),
    radial-gradient(900px 400px at -10% 110%, rgba(70, 212, 138, 0.05), transparent 55%),
    linear-gradient(180deg, #0a0a0f 0%, #0d0d14 100%);
  background-attachment: fixed;
  color: var(--text); min-height: 100vh;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(232, 182, 76, 0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232, 182, 76, 0.035) 1px, transparent 1px);
  background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
  mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
}
body::after {
  content: ''; position: fixed; top: 0; left: 0; width: 220px; height: 2px;
  z-index: 9999; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(247, 220, 141, 0.85), transparent);
  animation: scanline 7s linear infinite;
}
@keyframes scanline {
  0% { transform: translateX(-220px); }
  100% { transform: translateX(calc(100vw + 220px)); }
}
.app { display: flex; min-height: 100vh; position: relative; z-index: 1; }

/* ── 侧边栏 · 金属指挥台 ── */
.sidebar {
  width: 250px; background: linear-gradient(180deg, rgba(17, 17, 24, 0.98), rgba(10, 10, 15, 0.98));
  border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
  padding: 0 0 24px; display: flex; flex-direction: column;
  box-shadow: 6px 0 30px rgba(0, 0, 0, 0.55);
}
.sidebar::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #b8860b, #f7dc8d, #b8860b);
}
.sidebar-logo { padding: 26px 20px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.logo-badge { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 42px; height: 42px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px;
  background: linear-gradient(160deg, rgba(232, 182, 76, 0.2), rgba(232, 182, 76, 0.05));
  border: 1px solid rgba(232, 182, 76, 0.45); border-radius: 10px;
  box-shadow: inset 0 0 16px rgba(232, 182, 76, 0.25), 0 0 12px rgba(232, 182, 76, 0.15);
}
.logo-text h1 { font-size: 19px; color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: 1px; }
.pro-tag {
  font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #171003;
  background: linear-gradient(135deg, #f7dc8d, #e8b64c); padding: 2px 7px; border-radius: 4px;
  box-shadow: 0 0 10px rgba(232, 182, 76, 0.5);
}
.logo-text span { display: block; font-size: 10px; color: var(--accent2); letter-spacing: 2.5px; margin-top: 3px; text-transform: uppercase; opacity: 0.9; }
nav { flex: 1; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  color: var(--text2); cursor: pointer; transition: all 0.2s; font-size: 14px;
  border-left: 3px solid transparent; user-select: none; position: relative; letter-spacing: 0.5px;
}
.nav-item:hover { background: rgba(232, 182, 76, 0.06); color: #fff; border-left-color: rgba(232, 182, 76, 0.5); }
.nav-item.active {
  background: linear-gradient(90deg, rgba(232, 182, 76, 0.15), transparent 85%);
  border-left-color: var(--accent); color: var(--accent2); font-weight: 600;
  text-shadow: 0 0 14px rgba(232, 182, 76, 0.35);
}
.nav-item.active::after {
  content: ''; position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: var(--accent2);
  box-shadow: 0 0 8px var(--accent2);
}
.nav-icon { font-size: 18px; width: 24px; text-align: center; }

/* ── 主区域 ── */
.main { flex: 1; margin-left: 250px; padding: 32px; position: relative; }
.view-panel { animation: viewIn 0.3s ease; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
.header h2 { font-size: 26px; color: #fff; letter-spacing: 1px; position: relative; padding-left: 14px; }
.header h2::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 4px; height: 22px; background: linear-gradient(180deg, #f7dc8d, #b8860b);
  box-shadow: 0 0 8px rgba(232, 182, 76, 0.6); border-radius: 2px;
}
.header-status { display: flex; gap: 16px; }
.status-dot { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); }
.status-dot::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* ── 指标卡 · 金盾数据屏 ── */
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
.metric-card {
  position: relative; overflow: hidden; padding: 20px; border-radius: 12px;
  background: linear-gradient(160deg, rgba(26, 26, 34, 0.92), rgba(15, 15, 21, 0.92));
  border: 1px solid var(--border);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  transition: transform 0.2s, border-color 0.2s;
}
.metric-card:hover { transform: translateY(-3px); border-color: rgba(232, 182, 76, 0.4); }
.metric-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(232, 182, 76, 0.55), transparent);
}
.metric-card::after {
  content: ''; position: absolute; right: -1px; bottom: -1px; width: 26px; height: 26px;
  background: linear-gradient(135deg, transparent 50%, rgba(232, 182, 76, 0.18) 50%);
  border-bottom-right-radius: 12px;
}
.metric-label { font-size: 12px; color: var(--text2); margin-bottom: 8px; letter-spacing: 0.5px; }
.metric-value {
  font-size: 30px; font-weight: 800;
  font-family: "Cascadia Mono", "Consolas", monospace;
  background: linear-gradient(135deg, #f7dc8d 0%, #e8b64c 55%, #c8912b 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.metric-sub { font-size: 12px; color: var(--text2); margin-top: 4px; }
.metric-accent .metric-value {
  background: linear-gradient(135deg, #8df0c0, #46d48a 60%, #1f9e63);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}

/* ── 面板 · 战术玻璃卡 ── */
.panels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.panel {
  position: relative; background: var(--card); border-radius: 12px; padding: 24px;
  border: 1px solid var(--border);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(6px);
}
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.panel-header h3 { font-size: 15px; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.panel-header h3::before { content: '▍'; color: var(--accent); font-size: 16px; text-shadow: 0 0 8px rgba(232, 182, 76, 0.7); }
.panel-badge {
  font-size: 11px; padding: 3px 10px; border-radius: 12px;
  background: rgba(232, 182, 76, 0.1); color: var(--accent2); border: 1px solid rgba(232, 182, 76, 0.25);
}

/* ── 任务列表 ── */
.mission-list { list-style: none; }
.mission-item { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.mission-item:last-child { border-bottom: none; }
.mission-icon { font-size: 20px; }
.mission-info { flex: 1; }
.mission-title { font-size: 14px; font-weight: 500; }
.mission-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.mission-status {
  font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600; letter-spacing: 0.5px;
  border: 1px solid transparent;
}
.status-running { background: rgba(232, 182, 76, 0.1); color: var(--accent2); border-color: rgba(232, 182, 76, 0.35); }
.status-success { background: rgba(70, 212, 138, 0.1); color: var(--success); border-color: rgba(70, 212, 138, 0.35); }
.status-failed { background: rgba(255, 92, 92, 0.1); color: var(--danger); border-color: rgba(255, 92, 92, 0.35); }
.status-pending { background: rgba(255, 184, 77, 0.1); color: var(--warning); border-color: rgba(255, 184, 77, 0.35); }

/* ── AI 战士卡 ── */
.soldier-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.soldier-card {
  position: relative; overflow: hidden;
  background: linear-gradient(160deg, rgba(24, 24, 32, 0.9), rgba(14, 14, 20, 0.9));
  border-radius: 12px; padding: 20px; border: 1px solid var(--border);
  transition: transform 0.2s, border-color 0.2s;
}
.soldier-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(232, 182, 76, 0.45), transparent);
}
.soldier-card:hover { transform: translateY(-3px); border-color: rgba(232, 182, 76, 0.4); }
.soldier-header { display: flex; justify-content: space-between; margin-bottom: 14px; }
.soldier-name { font-size: 15px; color: #fff; font-weight: 600; letter-spacing: 0.5px; }
.soldier-role { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
.skill-bar { margin-bottom: 10px; }
.skill-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; color: var(--text2); }
.skill-track { height: 6px; background: rgba(0, 0, 0, 0.45); border-radius: 3px; overflow: hidden; border: 1px solid rgba(232, 182, 76, 0.12); }
.skill-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

/* ── 开关 ── */
.toggle-switch { position: relative; width: 40px; height: 22px; }
.toggle-switch input { display: none; }
.toggle-slider { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border); border-radius: 11px; cursor: pointer; transition: 0.3s; }
.toggle-slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; top: 3px; background: var(--text2); border-radius: 50%; transition: 0.3s; }
.toggle-switch input:checked + .toggle-slider { background: rgba(70, 212, 138, 0.3); border-color: var(--success); box-shadow: 0 0 10px rgba(70, 212, 138, 0.3); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); background: var(--success); }

/* ── 质量控制 ── */
.quality-bar { margin-bottom: 14px; }
.quality-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.quality-label { width: 80px; font-size: 12px; color: var(--text2); }
.quality-track { flex: 1; height: 8px; background: rgba(0, 0, 0, 0.45); border-radius: 4px; overflow: hidden; }
.quality-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; background: linear-gradient(90deg, #b8860b, #f7dc8d); }
.quality-score { width: 40px; text-align: right; font-size: 13px; font-weight: 700; color: var(--accent2); }

/* ── 页脚 ── */
.footer {
  text-align: center; color: var(--text2); font-size: 12px; margin-top: 40px; padding: 20px;
  border-top: 1px solid var(--border); position: relative; z-index: 1;
}
.footer-pro { color: var(--accent2); font-weight: 700; letter-spacing: 1px; text-shadow: 0 0 10px rgba(232, 182, 76, 0.4); }

/* ── 按钮 ── */
.btn {
  padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(24, 24, 32, 0.9); color: var(--text); cursor: pointer; font-size: 13px; transition: all 0.2s;
}
.btn:hover { background: rgba(232, 182, 76, 0.1); border-color: rgba(232, 182, 76, 0.4); color: #fff; }
.btn-primary {
  background: linear-gradient(135deg, #f2cd74, #e8b64c 65%, #c8912b);
  border-color: transparent; color: #1a1205; font-weight: 600;
  box-shadow: 0 2px 14px rgba(232, 182, 76, 0.3);
}
.btn-primary:hover { filter: brightness(1.1); color: #1a1205; }
.btn-danger { background: linear-gradient(135deg, #ff7a7a, #e84c4c); border-color: transparent; color: #fff; }
.btn-success { background: linear-gradient(135deg, #5fe09b, #2fae6d); border-color: transparent; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

.period-tabs { display: flex; gap: 8px; }
.period-tab { font-size: 12px; padding: 4px 12px; border-radius: 6px; cursor: pointer; background: rgba(0, 0, 0, 0.35); color: var(--text2); border: 1px solid var(--border); transition: 0.2s; }
.period-tab:hover { color: #fff; border-color: rgba(232, 182, 76, 0.4); }
.period-tab.active { background: rgba(232, 182, 76, 0.15); color: var(--accent2); border-color: var(--accent); }

.kb-stat { display: flex; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
.kb-stat:last-child { border-bottom: none; }
.kb-label { color: var(--text2); font-size: 14px; }
.kb-value { color: var(--accent2); font-size: 16px; font-weight: 700; }

/* ── 表单 ── */
input, textarea, select {
  background: rgba(10, 10, 15, 0.7); color: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232, 182, 76, 0.12); }
input::placeholder, textarea::placeholder { color: var(--text2); }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(232, 182, 76, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
.toast {
  position: fixed; top: 20px; right: 20px; z-index: 9999; padding: 12px 20px;
  border-radius: 8px; color: #fff; font-size: 14px; opacity: 0; transform: translateY(-10px);
  transition: all 0.3s; pointer-events: none; font-weight: 500;
  border: 1px solid transparent; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-success { background: rgba(28, 66, 44, 0.95); border-color: rgba(70, 212, 138, 0.5); }
.toast-error { background: rgba(80, 26, 26, 0.95); border-color: rgba(255, 92, 92, 0.5); }
.toast-info { background: rgba(52, 42, 16, 0.95); border-color: rgba(232, 182, 76, 0.5); }

.card-full { grid-column: 1 / -1; }
pre {
  background: rgba(8, 8, 12, 0.8); border: 1px solid var(--border); border-radius: 8px; padding: 16px;
  overflow-x: auto; font-size: 13px; white-space: pre-wrap; word-break: break-word;
  font-family: "Cascadia Mono", "Consolas", monospace;
}
.briefing-box { background: rgba(10, 10, 15, 0.75); border: 1px solid var(--border); border-radius: 10px; padding: 20px; max-height: 500px; overflow-y: auto; font-size: 14px; line-height: 1.8; }
.briefing-box h1, .briefing-box h2, .briefing-box h3 { color: var(--accent2); margin: 12px 0 8px 0; }
.briefing-box h1 { font-size: 18px; }
.briefing-box h2 { font-size: 16px; }
.briefing-box h3 { font-size: 14px; }
.briefing-box ul, .briefing-box ol { padding-left: 20px; margin: 8px 0; }
.briefing-box li { margin: 4px 0; }
.briefing-box strong { color: var(--warning); }
.briefing-box blockquote { border-left: 3px solid var(--accent); padding-left: 12px; margin: 8px 0; color: var(--text2); }

/* ── 响应式 ── */
@media (max-width: 1200px) { .metrics { grid-template-columns: repeat(2, 1fr); } .panels { grid-template-columns: 1fr; } }
@media (max-width: 768px) {
  .sidebar { width: 64px; }
  .sidebar .logo-text { display: none; }
  .sidebar .logo-icon { width: 34px; height: 34px; }
  .sidebar-logo { padding: 16px 0; display: flex; justify-content: center; }
  .sidebar .nav-item span:not(.nav-icon) { display: none; }
  .sidebar .nav-item { padding: 12px 0; justify-content: center; }
  .nav-item.active::after { display: none; }
  .main { margin-left: 64px; padding: 16px; }
  .metrics { grid-template-columns: 1fr; }
}

/* ── 商家数据录入 ── */
.md-label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 3px; }
.merchant-tabs { display: flex; gap: 4px; }
.merchant-tab { font-size: 11px; padding: 4px 12px; border-radius: 14px; cursor: pointer; background: rgba(0, 0, 0, 0.35); color: var(--text2); border: 1px solid var(--border); transition: 0.2s; user-select: none; white-space: nowrap; }
.merchant-tab:hover { color: #fff; border-color: rgba(232, 182, 76, 0.5); }
.merchant-tab.active { background: rgba(232, 182, 76, 0.16); color: var(--accent2); border-color: var(--accent); }
.md-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.md-kpi-card { background: rgba(14, 14, 20, 0.8); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); transition: border-color 0.2s; }
.md-kpi-card:focus-within { border-color: var(--accent); }
.md-kpi-card .kpi-name { font-size: 12px; color: #fff; margin-bottom: 2px; }
.md-kpi-card .kpi-unit { font-size: 10px; color: var(--accent2); margin-bottom: 4px; }
.md-kpi-card .kpi-hint { font-size: 9px; color: var(--text2); margin-bottom: 6px; opacity: 0.7; }
.md-kpi-card input { width: 100%; padding: 6px 10px; font-size: 13px; background: rgba(8, 8, 12, 0.8); border: 1px solid var(--border); border-radius: 6px; color: #fff; }
.md-kpi-card input:focus { border-color: var(--accent2); outline: none; }
.md-importance { font-size: 9px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
.md-importance-critical { background: rgba(255, 92, 92, 0.16); color: var(--danger); }
.md-importance-high { background: rgba(255, 184, 77, 0.16); color: var(--warning); }
.md-importance-medium { background: rgba(232, 182, 76, 0.16); color: var(--accent2); }
.md-raw-input { margin-bottom: 6px; }
.md-raw-input:last-child { margin-bottom: 0; }
.md-raw-input label { display: block; font-size: 11px; color: var(--text1); margin-bottom: 3px; }
.md-raw-input input { width: 100%; padding: 5px 8px; font-size: 12px; background: rgba(8, 8, 12, 0.8); border: 1px solid var(--border); border-radius: 5px; color: #fff; }
.md-raw-input input:focus { border-color: var(--accent2); outline: none; }
.md-raw-input .md-raw-unit { font-size: 9px; color: var(--text2); margin-left: 4px; }
.md-kpi-computed { border-left: 3px solid var(--accent2); }
.md-computed-badge { font-size: 9px; padding: 1px 6px; border-radius: 8px; margin-left: 4px; background: rgba(70, 212, 138, 0.16); color: var(--success); }
.md-history-item { background: rgba(14, 14, 20, 0.8); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
.md-history-item:hover { border-color: var(--accent); }
.md-history-item .md-h-period { font-size: 13px; color: #fff; font-weight: 600; }
.md-history-item .md-h-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
.md-history-item .md-h-kpis { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.md-history-item .md-h-kpi-tag { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(232, 182, 76, 0.1); color: var(--accent2); border: 1px solid rgba(232, 182, 76, 0.2); }
.md-report-section { margin-bottom: 16px; }
.md-report-section h4 { font-size: 14px; color: var(--accent2); margin-bottom: 6px; }
.md-report-section p, .md-report-section li { font-size: 13px; line-height: 1.8; }
.md-report-section ul { padding-left: 18px; }
.md-empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }

/* ── 品牌联想 ── */
.brand-suggest-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.15s; }
.brand-suggest-item:hover, .brand-suggest-item.active { background: rgba(232, 182, 76, 0.1); }

  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type + ' show';
  setTimeout(function() { t.className = 'toast'; }, 3000);

// ========== API 调用 ==========
var API_KEY = localStorage.getItem('arm_api_key') || '';
var MERCHANT_TOKEN = localStorage.getItem('ai_army_token') || '';
var API = {
  _cache: {},
  _headers: function() {
    var h = {};
    if (API_KEY) h['X-API-Key'] = API_KEY;
    // 商家后台JWT：优先使用商家登录token，让指挥中心读取商家后台配置
    if (MERCHANT_TOKEN) h['Authorization'] = 'Bearer ' + MERCHANT_TOKEN;
    return h;

  async fetch(endpoint, options) {
    options = options || {};
    try {
      var url = '/api/' + endpoint;
      if (options.method === 'POST' && options.body) {
        var resp = await fetch(url, { method:'POST', headers:Object.assign({'Content-Type':'application/json'}, this._headers()), body:JSON.stringify(options.body) });
      } else if (options.query) {
        var qs = new URLSearchParams(options.query).toString();
        resp = await fetch(url + (qs ? '?' + qs : ''), { method:options.method||'GET', headers:this._headers() });
      } else {
        resp = await fetch(url, { method:options.method||'GET', headers:this._headers() });
      }
      var data = await resp.json();
      return data;
    } catch(e) {
      console.error('API Error:', endpoint, e);
      return { status:'error', message: e.message };
    }
  },
  async post(endpoint, data) {
    var qs = new URLSearchParams(data).toString();
    var resp = await fetch('/api/' + endpoint + (qs ? '?' + qs : ''), { method:'POST', headers:this._headers() });
    try { return await resp.json(); } catch(e) { return { status:'error' }; }
  },
  async uploadFile(endpoint, file) {
    var form = new FormData();
    form.append('file', file);
    var resp = await fetch('/api/' + endpoint, { method:'POST', body: form });
    return await resp.json();
  },
  async loadSoldiers() {
    try {
      var data = await this.fetch('soldiers');
      return Array.isArray(data) ? data : [];
    } catch(e) { return []; }
  },
  async loadStatus() {
    try {
      return await this.fetch('status');
    } catch(e) { return { soldiers_count:0, missions_total:0 }; }
  },
  async loadKnowledgeStatus() {
    try {
      return await this.fetch('knowledge/status');
    } catch(e) { return { total_documents:0 }; }
  },
  async loadSchedulerStatus() {
    try {
      return await this.fetch('scheduler/status');
    } catch(e) { return { tasks:[] }; }
  }
};

// 初始化聊天面板
function chatInit(viewId) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  box.innerHTML = '';
  chatAppend(viewId, 'ai', (CHAT_CONFIG[viewId] || {}).welcome || '你好，有什么可以帮你？');
  chatRenderQuick(viewId, (CHAT_CONFIG[viewId] || {}).quicks);
}

// 追加消息（AI 消息按 markdown 渲染）
function chatAppend(viewId, role, content) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var msg = document.createElement('div');
  msg.className = 'chat-msg ' + role;
  msg.innerHTML = '<div class="chat-mini-avatar">' + (role === 'ai' ? '🤖' : '🧑') + '</div><div class="chat-bubble">' + (role === 'ai' ? simpleMarkdown(content) : content) + '</div>';
  box.appendChild(msg);
  box.scrollTop = box.scrollHeight;
}

// 打字动画
function chatTyping(viewId, on) {
  var box = document.getElementById('chat-box-' + viewId);
  if (!box) return;
  var t = document.getElementById('chat-typing-' + viewId);
  if (on) {
    if (t) return;
    var d = document.createElement('div');
    d.className = 'chat-msg ai';
    d.id = 'chat-typing-' + viewId;
    d.innerHTML = '<div class="chat-mini-avatar">🤖</div><div class="chat-bubble"><div class="chat-typing"><i></i><i></i><i></i></div></div>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  } else if (t) {
    t.remove();
  }
}

// 渲染主快捷指令
function chatRenderQuick(viewId, quicks) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (quicks || []).forEach(function(it) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (it.hot ? ' hot' : '');
    s.textContent = it.label;
    s.onclick = function() { chatSendText(viewId, it.send); };
    q.appendChild(s);
  });
}

// 渲染动态快捷选择
function chatChips(viewId, chips) {
  var q = document.getElementById('chat-quick-' + viewId);
  if (!q) return;
  q.innerHTML = '';
  (chips || []).forEach(function(c) {
    var s = document.createElement('span');
    s.className = 'chat-chip' + (c.hot ? ' hot' : '');
    s.textContent = c.label;
    s.onclick = function() { chatSendText(viewId, c.send); };
    q.appendChild(s);
  });
}

// 发送
function chatSend(viewId) {
  var input = document.getElementById('chat-input-' + viewId);
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  chatSendText(viewId, text);
}
function chatSendText(viewId, text) {
  chatAppend(viewId, 'user', escapeHtml(text));
  chatTyping(viewId, true);
  chatDispatch(viewId, text).finally(function() { chatTyping(viewId, false); });
}

// 命令分发
async function chatDispatch(viewId, text) {
  text = (text || '').trim();
  if (!text) return;
  var st = chatStates[viewId] = chatStates[viewId] || { mode: 'idle' };
  if (viewId === 'overview') return chatOverview(text);
  if (viewId === 'soldiers') return chatSoldiers(text);
  if (viewId === 'quality') return chatQuality(text, st);
  if (viewId === 'knowledge') return chatKnowledge(text, st);
  if (viewId === 'tools') return chatTools(text, st);
  if (viewId === 'store_mkt') return chatStoreMkt(text, st);
}

// 回放编排事件（step_start / step_end / tool_call / final）
async function orchReplay(viewId, events) {
  for (var i = 0; i < events.length; i++) {
    var ev = events[i];
    if (ev.type === 'step_start') {
      orchSetStep(viewId, ev.step, 'run');
      orchNote(viewId, 'STEP ' + ev.step + ' · ' + ev.label + ' — ' + ev.desc);
    } else if (ev.type === 'step_end') {
      orchSetStep(viewId, ev.step, 'done');
      var data = ev.data || {};
      var info = '';
      if (ev.key === 'intent' && data.domain) info = '已路由至「' + data.domain + '」';
      else if (ev.key === 'profile') info = '画像已绑定';
      else if (ev.key === 'tools') info = (data.tools_called > 0) ? '调用 ' + data.tools_called + ' 个工具：' + (data.tools || []).join(' / ') : '无需工具，经验推理';
      else if (ev.key === 'plans' && data.plan_count) info = '生成 ' + data.plan_count + ' 套方案';
      else if (ev.key === 'finalize') info = '执行指引已生成';
      orchNote(viewId, 'STEP ' + ev.step + ' ✓ ' + ev.label + (info ? ' — ' + info : ''));
    } else if (ev.type === 'tool_call') {
      orchTool(viewId, ev.tool, ev.args, true);
      orchNote(viewId, '🔧 正在调用工具 <b>' + ev.tool + '</b> ...');
    } else if (ev.type === 'final') {
      orchNote(viewId, '✅ 编排完成，最终执行指引已输出');
    }
    await orchSleep(ev.type === 'tool_call' ? 140 : 300);
  }
}
// 调用 v2.0 编排引擎并可视化
async function chatOrchestrate(viewId, text) {
  _orchBusy = true;
  var vis = document.getElementById('orche-vis-' + viewId);
  if (vis) vis.classList.add('on');
  orchReset(viewId);
  orchNote(viewId, '🧠 多过程编排启动：正在分析问题意图...');
  try {

    }

// ── 平台/语言/主题 匹配工具 ──
function matchPlatform(text) {
  var rules = [
    ['企业微信', '企业微信'], ['微信', '企业微信'],
    ['朋友圈', '朋友圈'], ['公众号', '公众号'],
    ['小红书', '小红书'], ['抖音', '抖音'], ['短视频', '抖音'],
    ['大众点评', '大众点评'], ['点评', '大众点评'],
    ['海报', '海报'], ['头条', '头条'],
  ];
  for (var i = 0; i < rules.length; i++) {
    if (text.indexOf(rules[i][0]) >= 0) return rules[i][1];
  }
  return '';
}
function matchLang(text) {
  var rules = [['python', 'Python'], ['javascript', 'JavaScript'], ['js', 'JavaScript'], ['sql', 'SQL'], ['shell', 'Shell']];
  var t = text.toLowerCase();
  for (var i = 0; i < rules.length; i++) {
    if (t.indexOf(rules[i][0]) >= 0) return rules[i][1];
  }
  return '';
}
function extractTopic(text, platform) {
  var t = text;
  t = t.replace(/^(帮我|请|麻烦|我想要|我要|我想)\s*/i, '');
  t = t.replace(/^(写|生成|创作|来|搞|出一)个?\s*/i, '');
  t = t.replace(/^(写|生成|创作|来|搞)\s*一?[篇条个段]?\s*/i, '');
  t = t.replace(/^(文案|内容|宣传语|推广文案|推广语)\s*/i, '');
  if (platform) t = t.replace(new RegExp('^.*?' + platform + '的?'), '');
  t = t.replace(/^(文案|内容)\s*/i, '');
  t = t.replace(/(文案|内容|宣传语)$/i, '');
  t = t.replace(/[，。！？!?,.;;：:]+$/g, '');
  return t.trim();
}

// ========== 辅助函数 ==========
function simpleMarkdown(md) {
  if (!md) return '';
  // 1. HTML转义
  var html = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  // 2. 代码块 (```...```)
  html = html.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, function(m, code) {
    return '<pre style="background:var(--bg);padding:12px;border-radius:6px;overflow-x:auto;font-size:11px;line-height:1.5;margin:8px 0;border:1px solid var(--border);"><code>' + code + '</code></pre>';
  });

  // 3. 表格 (| col1 | col2 | ... )
  html = html.replace(/(\|[^\n]+\|)\n(\|[-:\s|]+\|)\n((?:\|[^\n]+\|\n?)+)/g, function(m, header, sep, rows) {
    var hCols = header.split('|').filter(function(c){ return c.trim() !== ''; });
    var rLines = rows.trim().split('\n');
    var thead = '<thead><tr>' + hCols.map(function(c){ return '<th style="padding:6px 10px;border-bottom:1px solid var(--border);font-weight:600;text-align:left;background:rgba(255,255,255,0.03);">' + c.trim() + '</th>'; }).join('') + '</tr></thead>';
    var tbody = '<tbody>' + rLines.map(function(line) {
      var cols = line.split('|').filter(function(c){ return c.trim() !== ''; });
      return '<tr>' + cols.map(function(c){ return '<td style="padding:5px 10px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px;">' + c.trim() + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody>';
    return '<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;">' + thead + tbody + '</table>';
  });

  // 4. 标题
  html = html.replace(/^### (.+)$/gm, '<h3 style="margin:16px 0 8px;font-size:14px;color:var(--accent);">$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2 style="margin:18px 0 10px;font-size:15px;color:var(--accent);">$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1 style="margin:20px 0 12px;font-size:16px;color:var(--accent);">$1</h1>');

  // 5. 加粗/斜体/行内代码
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:1px 4px;border-radius:3px;font-size:12px;">$1</code>');

  // 6. 引用块
  html = html.replace(/^> (.+)$/gm, '<blockquote style="border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;color:var(--text2);font-style:italic;">$1</blockquote>');

  // 7. 列表（先处理无序列表，再处理有序）
  // 无序列表：- item
  html = html.replace(/(?:^\- .+(?:\n|$))+/gm, function(block) {
    var items = block.trim().split('\n').filter(function(l){ return l.trim().startsWith('-'); });
    return '<ul style="margin:8px 0;padding-left:18px;">' + items.map(function(i){ return '<li style="margin:3px 0;">' + i.replace(/^\-\s*/, '') + '</li>'; }).join('') + '</ul>';
  });
  // 有序列表：1. item
  html = html.replace(/(?:^\d+\.\s.+\n?)+/gm, function(block) {
    var items = block.trim().split('\n').filter(function(l){ return /^\d+\.\s/.test(l.trim()); });
    return '<ol style="margin:8px 0;padding-left:20px;">' + items.map(function(i){ return '<li style="margin:3px 0;">' + i.replace(/^\d+\.\s*/, '') + '</li>'; }).join('') + '</ol>';
  });

  // 8. 段落
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// 保存店铺配置
async function saveStoreConfig() {
  var name = getVal('store-name');
  if (!name) { showToast('请填一下店铺名称', 'info'); return; }
  if (!currentStoreType) { showToast('请先选择店铺类型', 'info'); return; }

  var params = {
    store_type: currentStoreType,
    store_name: name,
    products: getVal('store-products'),
    address: getVal('store-address'),
    hours: getVal('store-hours') || '10:00-22:00',
    phone: getVal('store-phone'),
    location_feature: getVal('store-feature'),
    faq_knowledge: getVal('store-faq'),
    latitude: parseFloat(getVal('store-lat')) || 0,
    longitude: parseFloat(getVal('store-lng')) || 0,
    search_radius: parseInt(getVal('store-radius')) || 0,
  };

  showToast('正在保存...', 'info');
  try {
    var data = await API.post('store/config', params);
    if (data.status === 'success') {
      storeConfigLoaded = true;
      storeTypesLoaded = true;
      showToast('✅ 保存成功！', 'success');
      showStoreOperations(data);
    } else {
      showToast('❌ ' + (data.message||'保存失败'), 'error');
    }
  } catch(e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}
function getVal(id) {
  var el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

async function startOnboarding(storeType) {

function onbAppendMessage(role, text) {
  var chatBox = document.getElementById('onb-chat-box');
  if (!chatBox) return;

  var msgDiv = document.createElement('div');
  msgDiv.className = 'onb-msg ' + role;

  var avatar = role === 'ai' ? '🤖' : '👤';
  var avatarLabel = role === 'ai' ? 'AI顾问' : '你';

  msgDiv.innerHTML =
    '<div class="onb-avatar ' + role + '">' + avatar + '</div>' +
    '<div class="onb-bubble ' + role + '">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>';

  chatBox.appendChild(msgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function onbSendMessage() {
  if (!_onboardingActive) return;

  var input = document.getElementById('onb-user-input');
  var sendBtn = document.getElementById('onb-send-btn');
  var chatBox = document.getElementById('onb-chat-box');
  var typingEl = document.getElementById('onb-typing');
  var userText = input.value.trim();

  if (!userText) return;

  // 显示用户消息
  onbAppendMessage('user', userText);
  input.value = '';
  input.disabled = true;
  if (sendBtn) sendBtn.disabled = true;
  if (typingEl) typingEl.style.display = 'flex';
  if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

  try {
    var data = await API.post('store/onboarding/chat', {message: userText});

    if (typingEl) typingEl.style.display = 'none';

    if (data.status === 'success') {
      if (data.message) {
        onbAppendMessage('ai', data.message);
      }

      // 对话完成，显示分析结果
      if (data.phase === 2) {
        _onboardingActive = false;
        var inputRow = document.getElementById('onb-input-row');
        if (inputRow) inputRow.style.display = 'none';
        renderOnboardingComplete(data);
      }
    } else {
      onbAppendMessage('ai', '不好意思，网络有点问题，你再说一次试试？');
    }
  } catch(e) {
    if (typingEl) typingEl.style.display = 'none';
    onbAppendMessage('ai', '哎呀，网络好像断了，要不你重新说一下？');
  }

  input.disabled = false;
  if (sendBtn) sendBtn.disabled = false;
  if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
  input.focus();
}

function renderOnboardingComplete(data) {
  var completeEl = document.getElementById('onb-complete');
  if (!completeEl) return;
  completeEl.style.display = 'block';

  var profile = data.profile || {};
  var advice = data.advice || '';
  var scores = data.scores || {};

  // 评分星星
  var scoreLabels = {
    score_location: '位置', score_product: '产品', score_customer: '客源',
    score_operation: '经营', score_potential: '潜力'
  };
  var starsHtml = '';
  for (var key in scoreLabels) {
    var s = parseInt(scores[key]) || 3;
    var filled = '★'.repeat(Math.min(s, 5));
    var empty = '☆'.repeat(Math.max(0, 5 - s));
    var color = s >= 4 ? 'var(--success)' : (s >= 3 ? 'var(--warning)' : 'var(--danger)');
    starsHtml +=
      '<div class="onb-score-item">' +
        '<div class="onb-score-stars" style="color:' + color + '">' + filled + empty + '</div>' +
        '<div class="onb-score-label">' + scoreLabels[key] + '</div>' +
      '</div>';
  }

  // 档案
  var profileFields = [
    ['store_name', '店名'], ['industry', '做什么'], ['address', '在哪里'],
    ['scale', '规模'], ['history', '开了多久'], ['main_products', '主营'],
    ['customer_profile', '客人特点'], ['business_status', '近期生意'],
    ['competition', '周边竞争']
  ];
  var profileHtml = '';
  for (var i = 0; i < profileFields.length; i++) {
    var fk = profileFields[i][0];
    var fl = profileFields[i][1];
    var fv = profile[fk];
    if (!fv) continue;
    if (Array.isArray(fv)) fv = fv.join('，');
    profileHtml +=
      '<div class="onb-profile-item">' +
        '<div class="pi-label">' + fl + '</div>' +
        '<div class="pi-value">' + escapeHtml(String(fv)) + '</div>' +
      '</div>';
  }

  // 痛点
  var pains = profile.pain_points;
  if (pains && pains.length > 0) {
    profileHtml +=
      '<div class="onb-profile-item" style="grid-column:1/-1;">' +
        '<div class="pi-label">😟 最头疼的事</div>' +
        '<div class="pi-value">' + escapeHtml(pains.join('、')) + '</div>' +
      '</div>';
  }

  completeEl.innerHTML =
    '<h3>📋 你的店铺档案</h3>' +
    '<div class="onb-score-row">' + starsHtml + '</div>' +
    '<div class="onb-profile-grid">' + profileHtml + '</div>' +
    '<h3 style="margin-top:8px;">💡 AI给你的建议</h3>' +
    '<div class="onb-advice-box">' + escapeHtml(advice).replace(/\n/g, '<br>') + '</div>' +
    '<div style="text-align:center;margin-top:16px;">' +
      '<button class="btn btn-primary" onclick="finishOnboarding()">✅ 好的知道了，进入管理面板</button>' +
      '<button class="onb-skip-btn" onclick="resetStoreType()" style="margin-left:10px;">↩ 重新来</button>' +
    '</div>';
}

async function mdChatSubmit() {
  var input = document.getElementById('md-chat-input');
  var resultEl = document.getElementById('md-chat-result');
  var text = input.value.trim();
  if (!text) return;

  resultEl.innerHTML = '<p style="color:var(--accent2);">⏳ AI正在分析你说的...</p>';
  input.value = '';
  input.disabled = true;

  try {
    // 调用诊断接口，用自然语言进行分析
    var diagnosisData = await API.post('store/diagnosis', {
      data: text,
      store_type: currentStoreType || ''
    });

    if (diagnosisData.status === 'success' && diagnosisData.diagnosis) {
      var diag = diagnosisData.diagnosis;
      var html = '<div style="font-size:14px;line-height:1.8;">';
      // 显示摘要
      if (diag.summary) {
        html += '<div style="background:rgba(108,92,231,0.1);padding:12px;border-radius:8px;margin-bottom:12px;">' +
          '<b>📊 分析结果：</b><br>' + escapeHtml(diag.summary) + '</div>';
      }
      // 显示层级
      if (diag.layers && diag.layers.length > 0) {
        for (var i = 0; i < diag.layers.length; i++) {
          var layer = diag.layers[i];
          html += '<div style="margin-bottom:8px;"><b>' + escapeHtml(layer.title || '') + '：</b>' +
            escapeHtml(layer.content || '') + '</div>';
        }
      }
      html += '</div>';
      resultEl.innerHTML = html;
    } else {
      resultEl.innerHTML = '<p style="color:var(--text2);">未能分析，请再试一次或切换到"记一笔"填具体数据。</p>';
    }
  } catch(e) {
    resultEl.innerHTML = '<p style="color:var(--danger);">出错了：' + escapeHtml(e.message) + '</p>';
  }

  input.disabled = false;
  input.focus();
}

// 表达式求值器
function evaluateExpr(expr, context) {
  var safeExpr = expr;
  // Sort keys by length descending to avoid partial replacements
  var keys = Object.keys(context).sort(function(a, b) { return b.length - a.length; });
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    var val = context[key];
    if (val == null || val === '') continue;
    var num = (typeof val === 'number') ? val : parseFloat(String(val).replace(/,/g,'').replace(/，/g,''));
    if (isNaN(num)) continue;
    var escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    safeExpr = safeExpr.replace(new RegExp(escapedKey, 'g'), num);
  }
  // Safety: only allow numbers and basic math operators
  if (!/^[\d\s+\-*/().]+$/.test(safeExpr)) return null;
  try {
    var result = eval(safeExpr);
    return (isNaN(result) || !isFinite(result)) ? null : Math.round(result * 100) / 100;
  } catch(e) {
    return null;
  }
}

function safeId(str) { return str.replace(/[^a-zA-Z0-9\u4e00-\u9fff]+/g,'_'); }

// 收集所有 KPI 输入为 JSON 字符串（自动从 raw_inputs 计算）
function collectKpiValues() {
  var result = {};
  if (!merchantGenomeCache || !merchantGenomeCache.kpi_formulas) return '{}';
  var kpis = merchantGenomeCache.kpi_formulas;
  
  // Step 1: 收集所有原始值（直接填的 KPI + raw_input 子字段）
  var rawValues = {};
  
  for (var name in kpis) {
    var kpi = kpis[name];
    var kpiSafe = safeId(name);
    
    if (kpi.raw_inputs) {
      // 收集 raw_input 子字段
      for (var i = 0; i < kpi.raw_inputs.length; i++) {
        var ri = kpi.raw_inputs[i];
        var rawId = 'md-raw-' + kpiSafe + '-' + safeId(ri.key);
        var el = document.getElementById(rawId);
        var val = el ? el.value.trim() : '';
        if (val) {
          var num = parseFloat(val.replace(/,/g,'').replace(/，/g,''));
          rawValues[ri.key] = isNaN(num) ? val : num;
        }
      }
    } else {
      // 直接填的 KPI
      var inputId = 'md-kpi-' + kpiSafe;
      var el = document.getElementById(inputId);
      var val = el ? el.value.trim() : '';
      if (val) {
        var num = parseFloat(val.replace(/,/g,'').replace(/，/g,''));
        rawValues[name] = isNaN(num) ? val : num;
      }
    }
  }

  // Step 2: 用 rawValues 计算所有带 compute_expr 的 KPI
  for (var name in kpis) {
    var kpi = kpis[name];
    if (kpi.compute_expr) {
      var computed = evaluateExpr(kpi.compute_expr, rawValues);
      if (computed !== null && !isNaN(computed)) {
        result[name] = computed;
      }
    } else if (rawValues[name] !== undefined) {
      result[name] = rawValues[name];
    }
  }

  // 保存原始输入供后续使用
  window._merchantRawInputs = rawValues;
  return JSON.stringify(result);
}

// 收集原始输入数据（用于传给后端做更细粒度的 AI 分析）
function collectRawInputs() {
  var result = {};
  if (!merchantGenomeCache || !merchantGenomeCache.kpi_formulas) return '{}';
  var kpis = merchantGenomeCache.kpi_formulas;
  for (var name in kpis) {
    var kpi = kpis[name];
    if (!kpi.raw_inputs) continue;
    var kpiSafe = safeId(name);
    result[name] = {};
    for (var i = 0; i < kpi.raw_inputs.length; i++) {
      var ri = kpi.raw_inputs[i];
      var rawId = 'md-raw-' + kpiSafe + '-' + safeId(ri.key);
      var el = document.getElementById(rawId);
      var val = el ? el.value.trim() : '';
      if (val) {
        var num = parseFloat(val.replace(/,/g,'').replace(/，/g,''));
        result[name][ri.key] = isNaN(num) ? val : num;
      }
    }
    // 如果没有填任何子字段，删除空对象
    if (Object.keys(result[name]).length === 0) delete result[name];
  }
  return JSON.stringify(result);
}

// 保存商家数据
async function saveMerchantData() {
  var label = document.getElementById('md-period-label').value.trim();
  if (!label) { showToast('请输入数据周期标签', 'info'); return; }

  var kpiJson = collectKpiValues();
  var rawInputsJson = collectRawInputs();
  var hasFile = merchantSelectedFile !== null;
  if (kpiJson === '{}' && rawInputsJson === '{}' && !hasFile) { showToast('请至少填写一项数据', 'info'); return; }

  showToast('正在保存数据...', 'info');

  try {
    var params = {
      store_type: currentStoreType,
      period_label: label,
      period_start: document.getElementById('md-period-start').value || '',
      period_end: document.getElementById('md-period-end').value || '',
      description: document.getElementById('md-description').value.trim(),
      kpi_data: kpiJson,
      raw_input_data: rawInputsJson,
    };

    var resp;
    if (hasFile) {
      // 有文件的走 FormData
      var form = new FormData();
      form.append('file', merchantSelectedFile);
      for (var k in params) { form.append(k, params[k]); }
      var fetchResp = await fetch('/api/store/merchant-data?' + new URLSearchParams(params).toString(), {
        method:'POST', body:form
      });
      resp = await fetchResp.json();
      // 清理文件状态
      merchantSelectedFile = null;
      document.getElementById('md-file-input').value = '';
      document.getElementById('md-file-name').textContent = '';
    } else {
      resp = await API.post('store/merchant-data', params);
    }

    if (resp.status === 'success') {
      showToast('✅ ' + (resp.message||'保存成功'), 'success');
      clearMerchantForm();
      loadMerchantHistory();
    } else {
      showToast('❌ ' + (resp.message||'保存失败'), 'error');
    }
  } catch(e) {
    showToast('保存失败: ' + e.message, 'error');
  }
}

// 渲染诊断报告
function renderDiagnosisReport(diag, fullResp) {
  var el = document.getElementById('mview-report');
  if (!el) return;

  var flags = fullResp ? (fullResp.red_flags_triggered || []) : [];
  var confidence = diag.confidence || 0;
  var confidenceHtml = confidence > 0 ? '<span style="font-size:11px;color:var(--text2);margin-left:8px;">置信度: ' + (confidence >= 0.9 ? '🟢 ' : confidence >= 0.7 ? '🟡 ' : '🔴 ') + (confidence * 100).toFixed(0) + '%</span>' : '';

  var flagHtml = '';
  if (flags.length > 0) {
    flagHtml = '<div class="md-report-section" style="background:rgba(255,77,79,0.06);border-left:3px solid var(--danger);">' +
      '<h4 style="margin-top:0;">🚨 红线预警</h4>' +
      flags.map(function(f) {
        var sev = f.severity || 'medium';
        var color = sev === 'critical' ? 'var(--danger)' : (sev === 'high' ? 'var(--warning)' : 'var(--accent)');
        var name = f.name || f.kpi || f.metric || '';
        var actual = f.actual !== undefined ? f.actual : '';
        var msg = f.message || f.reason || f.description || '';
        return '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">' +
          '<span style="color:' + color + ';font-weight:600;">' + escapeHtml(name) + '</span>' +
          (actual !== '' ? '<span style="font-size:12px;color:var(--danger);font-weight:600;">' + escapeHtml(String(actual)) + '</span>' : '') +
          '<span style="color:var(--text2);font-size:11px;flex:1;text-align:right;margin-left:8px;">' + escapeHtml(msg) + '</span>' +
        '</div>';
      }).join('') +
    '</div>';
  }

  // 判断是否为深度归因分析（看 attribution 长度和内容特征）
  var isDeep = diag.attribution && diag.attribution.length > 500 && (diag.attribution.indexOf('诊断摘要') > -1 || diag.attribution.indexOf('因果链') > -1);
  var attributionStyle = isDeep ? 'style="background:rgba(100,126,234,0.04);"' : '';
  var attributionBadge = isDeep ? '<span style="font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:10px;margin-left:8px;">AI深度</span>' : '';

  el.innerHTML = '' +
    flagHtml +
    (diag.observation ? '<div class="md-report-section" style="background:rgba(255,255,255,0.02);"><h4>📋 现状观察</h4>' + simpleMarkdown(diag.observation) + '</div>' : '') +
    (diag.attribution ? '<div class="md-report-section" ' + attributionStyle + '><h4>🔍 归因分析' + attributionBadge + confidenceHtml + '</h4>' + simpleMarkdown(diag.attribution) + '</div>' : '') +
    (diag.recommendation ? '<div class="md-report-section" style="background:rgba(255,255,255,0.02);"><h4>💡 改进建议</h4>' + simpleMarkdown(diag.recommendation) + '</div>' : '') +
    (diag.expected_impact ? '<div class="md-report-section" style="background:rgba(82,196,26,0.05);"><h4>📈 预期收益</h4>' + simpleMarkdown(diag.expected_impact) + '</div>' : '') +
    (diag.action_items && diag.action_items.length ? '<div class="md-report-section" style="background:rgba(255,255,255,0.02);"><h4>✅ 行动计划</h4><ul style="margin:8px 0;padding-left:18px;">' +
      diag.action_items.map(function(a) {
        var text = typeof a === 'string' ? a : (a.action || a.title || JSON.stringify(a));
        var tag = '';
        if (text.indexOf('【紧急】') > -1 || text.indexOf('【紧急】') > -1) tag = '<span style="font-size:10px;background:var(--danger);color:#fff;padding:1px 5px;border-radius:3px;margin-right:6px;">紧急</span>';
        else if (text.indexOf('【本周】') > -1 || text.indexOf('【本周】') > -1) tag = '<span style="font-size:10px;background:var(--warning);color:#fff;padding:1px 5px;border-radius:3px;margin-right:6px;">本周</span>';
        else if (text.indexOf('【本月】') > -1 || text.indexOf('【本月】') > -1) tag = '<span style="font-size:10px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-right:6px;">本月</span>';
        return '<li style="margin:5px 0;line-height:1.6;">' + tag + escapeHtml(text) + '</li>';
      }).join('') +
    '</ul></div>' : '');
}

// 浏览器定位
function getLocation() {
  var btn = document.getElementById('btn-locate');
  var statusEl = document.getElementById('locate-status');

  if (!navigator.geolocation) {
    if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '⚠️ 您的浏览器不支持定位功能，请使用地址转坐标或手动输入'; }
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '⏳ 定位中...'; }
  if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '<span class="spinner"></span> 正在获取位置（桌面端可能不精确，推荐使用地址转坐标）...'; }

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      var lat = pos.coords.latitude.toFixed(6);
      var lng = pos.coords.longitude.toFixed(6);
      var accuracy = Math.round(pos.coords.accuracy);
      document.getElementById('store-lat').value = lat;
      document.getElementById('store-lng').value = lng;
      var warnMsg = accuracy > 5000 ? ' ⚠️精度较低（±' + (accuracy/1000).toFixed(0) + '公里），建议使用"地址转坐标"获得精准定位' : '';
      if (statusEl) { statusEl.innerHTML = '✅ 定位成功！纬度: ' + lat + '，经度: ' + lng + '（精度: ±' + accuracy + '米）' + warnMsg; }
      if (btn) { btn.disabled = false; btn.textContent = '📡 重新定位'; }
      showToast('📍 定位完成' + (accuracy > 5000 ? '（精度偏低，建议用地址转坐标）' : ''), accuracy > 5000 ? 'info' : 'success');
    },
    function(err) {
      if (statusEl) {
        statusEl.style.display = 'block';
        var msg = '❌ 定位失败: ';
        switch(err.code) {
          case err.PERMISSION_DENIED: msg += '请允许浏览器获取位置权限'; break;
          case err.POSITION_UNAVAILABLE: msg += '无法获取位置信息'; break;
          case err.TIMEOUT: msg += '定位超时，请重试'; break;
          default: msg += err.message;
        }
        statusEl.innerHTML = msg + '，请使用地址转坐标或手动输入坐标';
      }
      if (btn) { btn.disabled = false; btn.textContent = '📡 重试定位'; }
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// 商家/地址搜索（POI级精度，像百度地图一样搜索具体商家）
var geocodeCache = {};
var _geocodeSuggestTimer = null;
function _onGeocodeInput() {
  var addr = document.getElementById('store-geocode-addr').value.trim();
  if (!addr || addr.length < 2) {
    var resultsEl = document.getElementById('geocode-results');
    if (resultsEl) resultsEl.style.display = 'none';
    return;
  }
  if (_geocodeSuggestTimer) clearTimeout(_geocodeSuggestTimer);
  _geocodeSuggestTimer = setTimeout(function() {
    geocodeAddress();
  }, 300);
}
function geocodeAddress() {
  var btn = document.getElementById('btn-geocode');
  var statusEl = document.getElementById('locate-status');
  var resultsEl = document.getElementById('geocode-results');
  var addr = document.getElementById('store-geocode-addr').value.trim();
  var city = document.getElementById('store-geocode-city').value.trim();
  var region = document.getElementById('store-geocode-region').value.trim();

  // 如果搜索框为空，尝试从店铺地址自动填充
  if (!addr) {
    addr = document.getElementById('store-address').value.trim();
    if (addr) {
      document.getElementById('store-geocode-addr').value = addr;
    } else {
      if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '⚠️ 请输入商家名称或地址进行搜索'; }
      return;
    }
  }

  // 缓存检查（包含城市/区域参数）
  var cacheKey = addr + '||' + city + '||' + region;
  if (geocodeCache[cacheKey]) {
    selectGeocodeResult(geocodeCache[cacheKey]);
    return;
  }

  if (btn) { btn.disabled = true; btn.textContent = '⏳ 搜索中...'; }
  if (statusEl) { statusEl.style.display = 'block'; statusEl.innerHTML = '<span class="spinner"></span> 正在搜索: ' + addr + '...'; }
  if (resultsEl) { resultsEl.style.display = 'none'; }

  // 调用后端POI搜索API（高德POI→百度Suggestion→地理编码→Nominatim五级兜底）
  var params = { address: addr, provider: 'auto' };
  if (city) params.city = city;
  if (region) params.region = region;

  API.post('geocode/search', params)
    .then(function(resp) {
      if (resp.status === 'success' && resp.results && resp.results.length > 0) {
        _handleGeocodeResults(resp.results, addr, resp.provider, cacheKey);
        if (btn) { btn.disabled = false; btn.textContent = '🔍 搜索'; }
      } else {
        // 后端失败，降级为直接调用Nominatim
        _geocodeNominatimFallback(addr, btn, statusEl, resultsEl);
      }
    })
    .catch(function() {
      // 网络错误，降级为直接调用Nominatim
      _geocodeNominatimFallback(addr, btn, statusEl, resultsEl);
    });
}

function _geocodeNominatimFallback(addr, btn, statusEl, resultsEl) {
  if (statusEl) { statusEl.innerHTML = '<span class="spinner"></span> 后端API不可用，使用公共Nominatim查询...'; }
  var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=10&countrycodes=cn&q=' + encodeURIComponent(addr);
  fetch(url, { headers: { 'Accept-Language': 'zh-CN', 'User-Agent': 'AI-Army/3.1' } })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data || data.length === 0) {
        if (statusEl) { statusEl.innerHTML = '❌ 未找到匹配结果，请尝试更具体的商家名称（如"宾川县 XX酒店"）'; }
        if (btn) { btn.disabled = false; btn.textContent = '🔍 搜索'; }
        return;
      }
      var results = data.map(function(item) { return { display_name: item.display_name, lat: parseFloat(item.lat).toFixed(6), lon: parseFloat(item.lon).toFixed(6), importance: item.importance || 0, provider: 'nominatim' }; });
      _handleGeocodeResults(results, addr, 'nominatim', '');
      if (btn) { btn.disabled = false; btn.textContent = '🔍 搜索'; }
    })
    .catch(function(err) {
      if (statusEl) { statusEl.innerHTML = '❌ 所有查询方式均失败: ' + err.message + '，请手动输入坐标'; }
      if (btn) { btn.disabled = false; btn.textContent = '🔍 搜索'; }
    });
}

function _handleGeocodeResults(results, addr, provider, cacheKey) {
  var statusEl = document.getElementById('locate-status');
  var resultsEl = document.getElementById('geocode-results');

  // 构建provider标签
  var providerLabels = {
    'amap_poi': '高德POI搜索',
    'baidu_sug': '百度商家搜索',
    'amap': '高德地理编码',
    'baidu': '百度地理编码',
    'nominatim': 'OpenStreetMap',
  };
  var providerLabel = providerLabels[provider] || provider.toUpperCase();
  var isPoi = (provider === 'amap_poi' || provider === 'baidu_sug');

  if (results.length === 1) {
    var item = results[0];
    document.getElementById('store-lat').value = item.lat;
    document.getElementById('store-lng').value = item.lon;

    // 自动填充相关信息（始终用最新结果覆盖，避免旧地址残留）
    var storeAddr = document.getElementById('store-address');
    if (storeAddr) {
      if (item.poi_address) {
        storeAddr.value = item.poi_address;
      } else if (item.display_name) {
        storeAddr.value = item.display_name;
      }
    }
    if (item.poi_tel && !document.getElementById('store-phone').value.trim()) {
      document.getElementById('store-phone').value = item.poi_tel;
    }

    var statusHtml = '✅ 精准定位 [' + providerLabel + ']';
    if (item.poi_name) statusHtml += ': <strong>' + item.poi_name + '</strong>';
    statusHtml += '（' + item.lat + ', ' + item.lon + '）';
    if (item.rating) statusHtml += ' ⭐' + item.rating;
    if (statusEl) { statusEl.innerHTML = statusHtml; }

    showToast('📍 ' + (item.poi_name || '位置') + ' 定位成功 (' + providerLabel + ')', 'success');
  } else {
    // 多条结果：渲染可点击的卡片列表
    var headerHtml = '<div style="font-size:11px;color:var(--accent2);margin-bottom:4px;">' +
      '找到 <strong>' + results.length + '</strong> 个匹配结果 [' + providerLabel + ']，请点击选择：</div>';
    var html = headerHtml;

    for (var i = 0; i < results.length; i++) {
      var item = results[i];
      var lat = item.lat;
      var lon = item.lon;
      var cacheIdx = cacheKey + '___' + i;
      geocodeCache[cacheIdx] = {
        lat: lat, lon: lon, display_name: item.display_name,
        poi_name: item.poi_name, poi_address: item.poi_address,
        poi_tel: item.poi_tel, poi_type: item.poi_type, rating: item.rating
      };

      // 构建结果卡片
      var cardHtml = '<div class="geocode-result-card" ' +
        'onclick="var k=\'' + cacheIdx.replace(/'/g, "\\'") + '\';selectGeocodeResult(geocodeCache[k]);" ' +
        'onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--border)\'"' +
        'style="padding:6px 8px;margin:3px 0;background:var(--bg);border-radius:6px;cursor:pointer;font-size:11px;border:1px solid var(--border);transition:all 0.15s;">';

      // 商家名称（大字）
      if (item.poi_name) {
        cardHtml += '<div style="font-weight:600;color:#fff;font-size:12px;margin-bottom:2px;">' + (i+1) + '. ' + item.poi_name + '</div>';
      } else {
        cardHtml += '<div style="font-weight:600;color:#fff;font-size:12px;margin-bottom:2px;">#' + (i+1) + ' ' + item.display_name + '</div>';
      }

      // 详细信息行
      var infoParts = [];
      if (item.poi_address) infoParts.push('<span style="color:var(--text2);">📍 ' + item.poi_address + '</span>');
      if (item.poi_type) infoParts.push('<span style="color:var(--accent2);">🏷 ' + item.poi_type + '</span>');
      if (item.rating) infoParts.push('<span style="color:#f5a623;">⭐ ' + item.rating + '</span>');
      if (item.poi_tel) infoParts.push('<span style="color:var(--text2);">📞 ' + item.poi_tel + '</span>');
      if (infoParts.length > 0) {
        cardHtml += '<div style="display:flex;flex-wrap:wrap;gap:4px 10px;">' + infoParts.join('') + '</div>';
      }

      // 坐标小字
      cardHtml += '<div style="color:var(--text2);font-size:10px;margin-top:2px;">坐标: ' + lat + ', ' + lon + '</div>';
      cardHtml += '</div>';
      html += cardHtml;
    }

    if (resultsEl) { resultsEl.style.display = 'block'; resultsEl.innerHTML = html; }
    if (statusEl) { statusEl.innerHTML = '找到 ' + results.length + ' 个匹配结果 [' + providerLabel + ']，请点击选择最精确的商家'; }
  }
}

async function fetchBrandSuggest(query) {
  if (query.length < 1) { hideBrandSuggest(); return; }

  var dd = document.getElementById('brand-suggest-dropdown');
  if (!dd) return;

  // 使用当前选择的行业类型作为上下文
  var storeType = currentStoreType || '';

  try {
    var params = { query: { q: query, store_type: storeType, limit: 8 } };
    var data = await API.fetch('store/brand-suggest', params);

    if (data.status !== 'success' || !data.suggestions || data.suggestions.length === 0) {
      dd.style.display = 'block';
      dd.innerHTML = '<div class="brand-suggest-empty">未找到匹配品牌，将使用自定义名称 "<strong>' + escapeHtml(query) + '</strong>"</div>';
      return;
    }

    brandActiveIdx = -1;
    dd.style.display = 'block';
    dd.innerHTML = data.suggestions.map(function(s, i) {
      var tags = '';
      if (s.category) tags += '<span class="bs-tag bs-tag-category">' + escapeHtml(s.category) + '</span>';
      if (s.scale) tags += '<span class="bs-tag bs-tag-scale">' + escapeHtml(s.scale) + '</span>';
      if (s.features) tags += '<span class="bs-tag bs-tag-features">' + escapeHtml(s.features) + '</span>';
      return '' +
      '<div class="brand-suggest-item" data-idx="' + i + '" ' +
        'onmousedown="selectBrandSuggestion(' + i + ')" ' +
        'onmouseenter="highlightBrandItem(' + i + ')">' +
        '<div class="bs-name">' + highlightMatch(s.name, query) + '</div>' +
        '<div class="bs-meta">' + tags + '</div>' +
      '</div>';
    }).join('') +
    '<div style="padding:8px 14px;font-size:10px;color:var(--text2);border-top:1px solid rgba(255,255,255,0.05);">' +
      '⌨️ ↑↓ 选择 · Enter 确认 · Esc 关闭 · 共 ' + data.count + ' 条' +
    '</div>';
  } catch(e) {
    dd.style.display = 'none';
  }
}

// 高亮匹配文字
function highlightMatch(text, query) {
  var idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.substring(0, idx)) +
    '<span class="brand-suggest-highlight">' + escapeHtml(text.substring(idx, idx + query.length)) + '</span>' +
    escapeHtml(text.substring(idx + query.length));
}

// 选中品牌
function selectBrandSuggestion(idx) {
  var dd = document.getElementById('brand-suggest-dropdown');
  if (!dd) return;
  var items = dd.querySelectorAll('.brand-suggest-item');
  if (idx < 0 || idx >= items.length) return;

  var nameEl = items[idx].querySelector('.bs-name');
  if (!nameEl) return;
  // 提取纯文本（去掉高亮 span）
  var name = nameEl.textContent || nameEl.innerText || '';
  document.getElementById('store-name').value = name;
  hideBrandSuggest();

  // 尝试自动填充主营产品（从 category 中提取）
  tryFillProductFromBrand(idx);
}

// 从品牌数据自动填充主营产品
function tryFillProductFromBrand(idx) {
  var dd = document.getElementById('brand-suggest-dropdown');
  if (!dd) return;
  var items = dd.querySelectorAll('.brand-suggest-item');
  if (idx < 0 || idx >= items.length) return;
  var item = items[idx];
  var metaEl = item.querySelector('.bs-meta');
  if (!metaEl) return;
  var tags = metaEl.querySelectorAll('.bs-tag');
  if (tags.length > 0) {
    // 第一个 tag 是 category
    var catTag = tags[0];
    if (catTag && catTag.classList.contains('bs-tag-category')) {
      var cat = catTag.textContent || catTag.innerText || '';
      var productsEl = document.getElementById('store-products');
      if (productsEl && !productsEl.value.trim() && cat) {
        productsEl.value = cat;
      }
    }
  }
}

// 鼠标悬停高亮
function highlightBrandItem(idx) {
  var dd = document.getElementById('brand-suggest-dropdown');
  if (!dd) return;
  var items = dd.querySelectorAll('.brand-suggest-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  if (idx >= 0 && idx < items.length) {
    items[idx].classList.add('active');
    brandActiveIdx = idx;
  }
}

// 隐藏下拉
function hideBrandSuggest() {
  var dd = document.getElementById('brand-suggest-dropdown');
  if (dd) { dd.style.display = 'none'; }
  brandActiveIdx = -1;
}

// 键盘导航
document.addEventListener('keydown', function(e) {
  var dd = document.getElementById('brand-suggest-dropdown');
  if (!dd || dd.style.display === 'none') return;

  var activeEl = document.activeElement;
  var storeNameInput = document.getElementById('store-name');
  if (activeEl !== storeNameInput) return;

  var items = dd.querySelectorAll('.brand-suggest-item');
  if (items.length === 0) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    brandActiveIdx = Math.min(brandActiveIdx + 1, items.length - 1);
    highlightBrandItem(brandActiveIdx);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    brandActiveIdx = Math.max(brandActiveIdx - 1, 0);
    highlightBrandItem(brandActiveIdx);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (brandActiveIdx >= 0) {
      selectBrandSuggestion(brandActiveIdx);
    }
  } else if (e.key === 'Escape') {
    hideBrandSuggest();
  }
});

// ========== 地理编码 ==========

// 选择地理编码结果
function selectGeocodeResult(item) {
  document.getElementById('store-lat').value = item.lat;
  document.getElementById('store-lng').value = item.lon;

  var statusEl = document.getElementById('locate-status');
  var resultsEl = document.getElementById('geocode-results');

  var info = item.poi_name || item.display_name || '';
  if (statusEl) { statusEl.innerHTML = '✅ 已选择: <strong>' + info + '</strong>（' + item.lat + ', ' + item.lon + '）'; }
  if (resultsEl) { resultsEl.style.display = 'none'; }

  // 同步更新店铺信息（始终用最新选择覆盖，避免旧地址残留）
  var storeAddr = document.getElementById('store-address');
  if (storeAddr) {
    if (item.poi_address) {
      storeAddr.value = item.poi_address;
    } else if (item.display_name) {
      storeAddr.value = item.display_name;
    }
  }
  if (item.poi_tel && !document.getElementById('store-phone').value.trim()) {
    document.getElementById('store-phone').value = item.poi_tel;
  }
  // 如果店铺名称为空，自动回填 POI 名称
  if (item.poi_name && !document.getElementById('store-name').value.trim()) {
    document.getElementById('store-name').value = item.poi_name;
  }

  // 更新搜索框显示已选择的地址
  var geocodeAddr = document.getElementById('store-geocode-addr');
  if (geocodeAddr && !geocodeAddr.value.trim()) {
    geocodeAddr.value = item.poi_name || item.display_name || '';
  }

  showToast('📍 商家坐标已设置', 'success');

  // 自动识别行业 → 保存 → 分析
  autoIdentifyAndAnalyze(item);
}

// 选择地址后：自动识别行业、保存配置、触发经营分析
async function autoIdentifyAndAnalyze(item) {
  var inferred = item.inferred_store_type || '';
  var poiType = item.poi_type || '';

  // 1. 自动选择店铺类型（如果后端推断出了行业）
  if (inferred && storeTypesData.some(function(t) { return t.id === inferred; })) {
    if (currentStoreType !== inferred) {
      selectStoreType(inferred);
      showToast('🏷️ 已根据地图信息自动识别行业：' + inferred + (poiType ? '（' + poiType + '）' : ''), 'success');
    }
  } else if (poiType) {
    showToast('ℹ️ 未识别到匹配行业，POI类型：' + poiType, 'info');
  }

  // 2. 延迟一下，确保 DOM 更新和 step2 表单已显示
  await new Promise(function(resolve) { setTimeout(resolve, 300); });

  // 3. 自动保存店铺配置
  var name = getVal('store-name');
  if (currentStoreType && name) {
    try {
      await saveStoreConfig();
      // 4. 保存成功后触发经营诊断/分析
      await runAutoDiagnosisAfterSave(name);
    } catch(e) {
      console.error('自动保存或分析失败', e);
      showToast('自动分析失败：' + e.message, 'error');
    }
  } else {
    showToast('请补充店铺名称和行业信息后点击保存', 'info');
  }
}

// 保存后自动运行一次经营诊断
async function runAutoDiagnosisAfterSave(storeName) {
  try {
    var text = '店铺名称：' + storeName + '；' +
               '地址：' + getVal('store-address') + '；' +
               '主营：' + getVal('store-products') + '；' +
               '坐标：(' + getVal('store-lat') + ', ' + getVal('store-lng') + ')';

    var diagResp = await API.post('store/diagnosis', {
      data: text,
      store_type: currentStoreType || ''
    });

    if (diagResp.status === 'success' && diagResp.diagnosis) {
      // 如果有诊断报告面板，渲染到商家报告面板
      var reportEl = document.getElementById('mview-report') || document.getElementById('store-analyze-result');
      if (reportEl) {
        renderDiagnosisReport(diagResp.diagnosis, diagResp);
      }
      showToast('✅ 经营分析完成', 'success');
      // 切换到报告视图（如果存在）
      if (typeof switchMerchantTab === 'function') {
        switchMerchantTab('report');
      }
    } else {
      showToast('分析完成但未返回结果', 'info');
    }
  } catch(e) {
    console.error('自动诊断失败', e);
    showToast('经营分析失败：' + e.message, 'error');
  }
}

// 搜寻周边竞品
async function searchNearbyCompetitors() {
  var resultEl = document.getElementById('store-nearby-result');
  var btn = document.getElementById('btn-search-nearby');

  // 获取坐标（从输入框，其次sessionStorage）
  var lat = parseFloat(getVal('store-lat')) || parseFloat(sessionStorage.getItem('store_lat')) || 0;
  var lng = parseFloat(getVal('store-lng')) || parseFloat(sessionStorage.getItem('store_lng')) || 0;
  var radius = parseInt(document.getElementById('store-search-radius').value) || 1000;

  // 获取行业信息
  var storeType = document.getElementById('store-search-type').value;
  var products = document.getElementById('store-search-products').value.trim();

  if (!lat || !lng) {
    if (resultEl) {
      resultEl.style.display = 'block';
      resultEl.innerHTML = '<p style="color:var(--warning);">⚠️ 请先在店铺信息中设置定位坐标，或点击"获取当前位置"按钮</p>';
    }
    showToast('请先设置店铺定位', 'info');
    return;
  }

  var industryHint = products ? '（行业：' + (storeType ? document.getElementById('store-search-type').options[document.getElementById('store-search-type').selectedIndex].text : '自动识别') + '）' : '';

  if (resultEl) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<p><span class="spinner"></span> 正在搜索周边' + radius + '米范围竞品' + industryHint + '...</p>';
  }
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 搜索中...'; }

  try {
    var reqBody = {
      latitude: lat,
      longitude: lng,
      radius: radius
    };
    if (storeType) reqBody.store_type = storeType;
    if (products) reqBody.products = products;

    var resp = await API.post('store/competitor/search', reqBody);

    if (!resultEl) return;

    if (resp.status === 'success') {
      var infoLines = ['📍 坐标: (' + lat + ', ' + lng + ') | 搜索半径: ' + (radius < 1000 ? radius + '米' : (radius/1000).toFixed(1) + '公里')];
      if (resp.industry && resp.industry.type) {
        infoLines.push('🏷️ 行业: ' + resp.industry.type + (resp.industry.subcategory ? ' - ' + resp.industry.subcategory : ''));
      }
      resultEl.innerHTML =
        '<div style="margin-bottom:8px;color:var(--accent2);font-size:12px;">' +
        infoLines.join('<br>') +
        '</div>' +
        '<div class="briefing-box" style="border-left:3px solid var(--accent);">' +
        simpleMarkdown(resp.analysis||'') +
        '</div>';
      showToast('✅ 周边竞品分析完成', 'success');
    } else {
      resultEl.innerHTML = '<p style="color:var(--danger);">❌ ' + (resp.message||'搜索失败') + '</p>';
    }
  } catch(e) {
    if (resultEl) resultEl.innerHTML = '<p style="color:var(--danger);">❌ 搜索失败: ' + e.message + '</p>';
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔍 搜索周边竞品'; }
  }
}

// ========== 安全 DOM 操作 ==========
function safeQuery(selector) {
  try { return document.querySelector(selector); } catch(e) { return null; }
}
function safeQueryAll(selector) {
  try { return document.querySelectorAll(selector); } catch(e) { return []; }
}
function safeGetEl(id) {
  try { return document.getElementById(id); } catch(e) { return null; }
}

// ========== 营业数据大屏 · 沉浸全屏集成 ==========
var bigscreenOpen = false;
var bigscreenSrc = '/static/live_bigscreen.html';
function openBigscreen() {
  try {
    var layer = document.getElementById('bigscreenLayer');
    if (!layer) return;
    var fr = document.getElementById('bigscreenFrame');
    if (fr) {
      if (!fr.getAttribute('src') || fr.getAttribute('src') === 'about:blank') {
        if (!fr.getAttribute('data-bound')) {
          // 懒加载：仅首次注入 src，同源 iframe 内按 Esc 也可返回
          fr.setAttribute('data-bound', '1');
          fr.addEventListener('load', function() {
            try {
              if (fr.contentWindow) {
                fr.contentWindow.addEventListener('keydown', function(ev) {
                  if (ev.key === 'Escape') closeBigscreen();
                });
              }
            } catch(err) {}
          });
        }
        fr.setAttribute('src', bigscreenSrc);
      }
    }
    layer.classList.add('on');
    bigscreenOpen = true;
    document.body.style.overflow = 'hidden';
    // 底部提示条常驻，不自动隐藏
    // 侧边栏高亮当前项
    safeQueryAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
    var navEl = safeQuery('[data-view="bigscreen"]');
    if (navEl) navEl.classList.add('active');
  } catch(e) { console.error('openBigscreen error:', e); }
}
function closeBigscreen() {
  try {
    var layer = document.getElementById('bigscreenLayer');
    if (layer) layer.classList.remove('on');
    bigscreenOpen = false;
    document.body.style.overflow = '';
    // 恢复进入大屏前的视图高亮
    safeQueryAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
    var navEl = safeQuery('[data-view="' + currentView + '"]');
    if (!navEl) navEl = safeQuery('[data-view="overview"]');
    if (navEl) navEl.classList.add('active');
  } catch(e) { console.error('closeBigscreen error:', e); }
}

// ========== 路由切换（CSS显示/隐藏，保留已填写信息） ==========
var currentView = 'overview';
function switchView(viewName) {
  try {
    // 营业数据大屏 → 沉浸全屏模式，不走普通面板
    if (viewName === 'bigscreen') { openBigscreen(); return; }
    // 更新导航高亮
    var navItems = safeQueryAll('.nav-item');
    navItems.forEach(function(el) { el.classList.remove('active'); });
    var navEl = safeQuery('[data-view="' + viewName + '"]');
    if (navEl) navEl.classList.add('active');

    // CSS切换：隐藏当前面板，显示目标面板
    var oldPanel = document.getElementById('view-' + currentView);
    var newPanel = document.getElementById('view-' + viewName);
    if (oldPanel) oldPanel.style.display = 'none';
    if (newPanel) newPanel.style.display = 'block';

    currentView = viewName;

    // 切换视图后加载对应数据
    if (viewName === 'overview') refreshOverview();
    if (viewName === 'knowledge') refreshKB();
    if (viewName === 'tools') refreshSchedulerInTool();
    if (viewName === 'store') {
      // 如果还没加载过店铺类型，加载；否则刷新已保存的配置
      if (!storeTypesLoaded) {
        loadStoreTypes();
      } else {
        // 已加载过，尝试从后端恢复最新配置
        refreshStoreConfig();
      }
    }
  } catch(e) {
    console.error('switchView error:', e);
  }
}

// 刷新店铺配置（切换回店铺页时调用）
var storeTypesLoaded = false;
async function refreshStoreConfig() {
  try {
    var data = await API.fetch('store/config');
    if (data.status === 'success' && data.config && data.config.type) {
      // 后端有配置，直接进入运营面板
      if (!storeConfigLoaded) {
        currentStoreType = data.config.type;
        storeConfigLoaded = true;
      }
      fillStoreFormIfEmpty(data.config);
      showStoreOperations(data);
    }
  } catch(e) {}
}

// 仅在字段为空时回填（保护用户已修改但未保存的输入）
function fillStoreFormIfEmpty(config) {
  var fields = {
    'store-name': config.name,
    'store-products': config.products,
    'store-address': config.address,
    'store-hours': config.hours,
    'store-phone': config.phone,
    'store-feature': config.location_feature,
    'store-faq': config.faq_knowledge,
    'store-lat': config.latitude,
    'store-lng': config.longitude,
    'store-radius': config.search_radius,
  };
  for (var id in fields) {
    var el = document.getElementById(id);
    if (el && !el.value && fields[id]) {
      el.value = fields[id];
    }
  }
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', function() {
  try {
    // 1. 一次性渲染所有视图面板到预创建的容器中
    var viewIds = ['overview', 'soldiers', 'quality', 'knowledge', 'tools', 'store'];
    for (var i = 0; i < viewIds.length; i++) {
      var v = viewIds[i];
      var panel = document.getElementById('view-' + v);
      if (panel && views[v]) {
        panel.innerHTML = views[v]();
      }
    }

    // 1.5 初始化各视图聊天指挥台
    ['overview', 'soldiers', 'quality', 'knowledge', 'tools', 'store_mkt'].forEach(function(cv) {
      try { chatInit(cv); } catch(e) {}
    });

    // 1.6 初始化 v2.0 编排可视化（总览指挥中枢）
    try {
      orchBuild('overview');
      orchQuickInit('overview', ORCH_QUICK_EXAMPLES);
    } catch(e) { console.error('orch init error:', e); }

    // 2. 导航点击（CSS切换，不重建DOM）
    safeQueryAll('.nav-item').forEach(function(item) {
      item.addEventListener('click', function() {
        try {
          var view = item.getAttribute('data-view');
          if (view) switchView(view);
        } catch(e) { console.error('nav click error:', e); }
      });
    });

    // 2.1 数据大屏退出（右上角按钮 / Esc 键）
    var bsExit = document.getElementById('bigscreenExit');
    if (bsExit) bsExit.addEventListener('click', function(e) { e.stopPropagation(); closeBigscreen(); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && bigscreenOpen) closeBigscreen();
    });

    // 地址搜索框实时联想（输入开头几个字自动弹出候选）
    var geoAddrInput = document.getElementById('store-geocode-addr');
    if (geoAddrInput) {
      geoAddrInput.addEventListener('input', _onGeocodeInput);
    }

    // 3. 加载战士数据并显示默认页面
    refreshSoldierData().then(function() {
      switchView('overview');
    });

    // 4. 自动刷新（每60秒）
    setInterval(function() {
      try {
        refreshOverview();
        console.log('🔄 自动刷新中...');
      } catch(e) {}
    }, 60000);

    // 5. 初始刷新 footer
    setTimeout(function() {
      refreshOverview();
    }, 2000);

    // 6. 首页即大屏：进入指挥中心自动全屏展示营业数据大屏（右上角/ Esc 可返回）
    setTimeout(function() {
      try { openBigscreen(); } catch(e) { console.error('auto bigscreen error:', e); }
    }, 900);

  } catch(e) {
    console.error('初始化错误:', e);
  }
});
</script>
