  - name: "新菜推荐"
    icon: "🆕"
    desc: "新品上市推广文案+海报"
  - name: "节日套餐"
    icon: "🎉"
    desc: "节日限定套餐营销内容"
  - name: "会员日"
    icon: "👑"
    desc: "会员专属优惠活动"
  - name: "好评引导"
    icon: "⭐"
    desc: "引导顾客写好评的话术"
  - name: "外卖优化"
    icon: "🛵"
    desc: "外卖平台商品描述优化"
  - name: "私域引流"
    icon: "💬"
    desc: "引导顾客加微信/微信群"
  - name: "抖音/小红书种草"
    icon: "📱"
    desc: "短视频探店内容策划"
  - name: "午市/晚市套餐"
    icon: "☀️"
    desc: "分时段套餐推广"

prompt_templates:
  analysis: |
    你是{store_type}行业的资深经营顾问。
    请基于以下经营数据进行诊断分析：

    ## 行业基准（{store_type}）
    {benchmarks_context}

    ## 红线预警
    {red_flags_context}

    ## 分析规则
    1. 所有指标必须与行业基准对比，使用"您的XX为{value}，{comparison}行业均值{benchmark}"
    2. 对异常指标进行根因分析（不是描述现象，而是找出为什么）
    3. 归因颗粒度：必须到"时段/品类/人员"级别，禁止笼统归因
    4. 建议必须可量化（如"调整午市套餐定价+10元，预计客单价提升8-12元"）
    5. 按经营紧急度排序，最紧急的问题放在最前面

  attribution: |
    你是{store_type}行业的归因分析专家。
    请对以下经营数据进行因果归因分析：

    ## 分析框架
    1. **现象识别**：哪些指标出现异常？
    2. **因果链**：指标之间的因果传导路径是什么？（如：差评增加 → 评分下降 → 到店客流减少 → 营收下滑）
    3. **根因定位**：追溯到最根本的原因（是产品问题？运营问题？市场问题？还是管理问题？）
    4. **影响量化**：估算每个根因对营收/利润的影响金额

    ## 行业基准参照
    {benchmarks_context}

    ## 数据
    {data_context}

